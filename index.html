<!-- Styles.html — design tokens + พื้นฐานที่ใช้ร่วมกันทั้งหลังร้าน (Index) และหน้าบ้าน (Public)
     ดึงเข้าแต่ละหน้าด้วย scriptlet include('Styles') ใน head · ลำดับ: Appearance (data-theme) แยกจาก Accent (data-accent) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<script>
/* ตั้งโหมดสว่าง/มืดก่อนวาดหน้า เพื่อไม่ให้จอกระพริบ · ค่า: light | dark | auto (ค่าเริ่มต้น) */
(function () {
  var pref = 'auto';
  try { pref = localStorage.getItem('wk_appearance') || 'auto'; } catch (e) {}
  var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  var h = document.documentElement;
  h.setAttribute('data-theme', dark ? 'dark' : 'light');
  h.setAttribute('data-appearance', pref);
  if (!h.getAttribute('data-accent')) h.setAttribute('data-accent', 'sky');
})();
</script>
<style>
/* ================= Tokens: Light · Crisp Daylight ================= */
:root {

html[data-accent="sunset"]      { --accent-l: #C2410C; --accent-d: #F28C52; }
html[data-accent="xmas"]        { --accent-l: #13733A; --accent-d: #4ADE80; --accent2-l: #B91C1C; --accent2-d: #F87171; }
html[data-accent="songkran"]    { --accent-l: #0E7490; --accent-d: #2CC5DB; }

:root {

/* ค่าที่ derive จาก accent — ประกาศที่ html (ไม่ใช่ :root) เพื่อให้คำนวณใหม่ทุกครั้งที่ accent เปลี่ยน */
html, html[data-theme] {
  --accent-hover: color-mix(in srgb, var(--accent) 88%, var(--text));
  --accent-soft: color-mix(in srgb, var(--accent) 12%, var(--surface));
  --accent-softer: color-mix(in srgb, var(--accent) 6%, var(--surface));
  --accent-line: color-mix(in srgb, var(--accent) 40%, var(--border));
  --ring: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent);

  /* ---------- alias ชื่อตัวแปรเดิม (JS/inline style ในหน้ายังอ้างอยู่ ห้ามลบ) ---------- */
  --bg: var(--canvas);
  --ink: var(--text);
  --muted: var(--text-2);
  --line: var(--border);
  --brand: var(--accent);
  --brand-ink: var(--accent-ink);
  --sky: var(--accent-line);
  --sky-soft: var(--accent-soft);
  --sky-softer: var(--surface-2);
  --tint-a: var(--accent-soft);
  --tint-b: var(--surface);
  --login-top: var(--canvas);
  --skel-a: var(--surface-3);
  --skel-b: var(--surface-2);
  --chip-past: var(--surface-3);
  --day-past: var(--surface-2);
  --day-past-ink: var(--text-3);
  --switch-off: var(--border-strong);
  --shadow: var(--shadow-sm);
  --font: var(--font-sans);
  --display: var(--font-sans);

/* ================= Tinted neutrals (v2) =================
 * พื้น/การ์ด/ขอบ/ตัวอักษร "อมสีธีม" อัตโนมัติ: ผสมสี accent ของธีมลงในเทาเป็นกลางเล็กน้อย
 * → ทุกธีม (sky, midnight, sunset, xmas, songkran, loykrathong, national) ได้บรรยากาศของตัวเองทั้งกลางวัน/กลางคืน
 * ตัวเลข % ถูกจูนให้ตัวอักษรผ่าน WCAG AA ทุกธีม × ทั้ง 2 โหมด (ตรวจด้วยสคริปต์ contrast แล้ว)
 * selector มี [data-accent] เพื่อให้ชนะ :root และคำนวณใหม่ทุกครั้งที่เปลี่ยนธีม */
html[data-accent] {
  --hue: var(--accent-l);
  --canvas: color-mix(in oklab, var(--hue) 6%, #F5F6F8);
  --surface: color-mix(in oklab, var(--hue) 1.5%, #FFFFFF);
  --surface-2: color-mix(in oklab, var(--hue) 3.5%, #FAFBFC);
  --surface-3: color-mix(in oklab, var(--hue) 7%, #F0F2F5);
  --surface-pop: #FFFFFF;
  --border: color-mix(in oklab, var(--hue) 10%, #E3E6EB);
  --border-strong: color-mix(in oklab, var(--hue) 14%, #CDD2DA);
  --input-bg: color-mix(in oklab, var(--hue) 1.5%, #FFFFFF);
  --input-border: color-mix(in oklab, var(--hue) 14%, #CDD2DA);
  --text: color-mix(in oklab, var(--hue) 10%, #0F1520);
  --text-2: color-mix(in oklab, var(--hue) 14%, #535C6C);
  --text-3: color-mix(in oklab, var(--hue) 12%, #8A93A3);
  --shadow-sm: 0 1px 2px color-mix(in oklab, var(--hue) 20%, rgba(16, 24, 40, .06));
  --shadow-md: 0 10px 28px -6px color-mix(in oklab, var(--hue) 25%, rgba(16, 24, 40, .14)), 0 2px 6px rgba(16, 24, 40, .05);
  --glass: color-mix(in oklab, var(--canvas) 76%, transparent);
  --mint-soft: color-mix(in oklab, var(--mint) 11%, var(--surface));
  --amber-soft: color-mix(in oklab, var(--amber) 11%, var(--surface));
  --rose-soft: color-mix(in oklab, var(--rose) 9%, var(--surface));
  --rest-soft: color-mix(in oklab, var(--rest) 9%, var(--surface));
}
html[data-theme="dark"][data-accent] {
  --hue: var(--accent-d);
  /* เลเยอร์ความลึก: canvas (ลึกสุด) → surface (การ์ด) → surface-2/3 → surface-pop (dropdown/เมนู ลอยเหนือสุด) */
  --canvas: color-mix(in oklab, var(--hue) 7%, #0C0E13);
  --surface: color-mix(in oklab, var(--hue) 7%, #14171E);
  --surface-2: color-mix(in oklab, var(--hue) 8%, #191D25);
  --surface-3: color-mix(in oklab, var(--hue) 10%, #20252F);
  --surface-pop: color-mix(in oklab, var(--hue) 9%, #1D2129);
  --border: color-mix(in oklab, var(--hue) 12%, #252A35);
  --border-strong: color-mix(in oklab, var(--hue) 16%, #2E3442);
  --input-bg: color-mix(in oklab, var(--hue) 6%, #101319);
  --input-border: color-mix(in oklab, var(--hue) 16%, #2E3442);
  --text: color-mix(in oklab, var(--hue) 5%, #F1F3F6);
  --text-2: color-mix(in oklab, var(--hue) 10%, #A4ABB8);
  --text-3: color-mix(in oklab, var(--hue) 10%, #737B8A);
  --shadow-sm: none;
  --shadow-md: 0 18px 44px -10px rgba(0, 0, 0, .62), 0 0 0 1px color-mix(in oklab, var(--hue) 8%, rgba(255, 255, 255, .03));
  --glass: color-mix(in oklab, var(--surface) 72%, transparent);
  /* กลางคืน: ลดความจัดของสีเน้นลงเล็กน้อย ไม่ให้แสบตา (ยังผ่าน AA กับตัวอักษรบนปุ่ม) */
  --accent: color-mix(in oklab, var(--accent-d) 88%, #C9CDD6);
  --accent-2: color-mix(in oklab, var(--accent2-d) 88%, #C9CDD6);
  --mint-soft: color-mix(in oklab, var(--mint) 14%, var(--surface));
  --amber-soft: color-mix(in oklab, var(--amber) 13%, var(--surface));
  --rose-soft: color-mix(in oklab, var(--rose) 14%, var(--surface));
  --rest-soft: color-mix(in oklab, var(--rest) 15%, var(--surface));
}
/* วันที่ผ่านมาแล้วในปฏิทิน: จางลงแต่ยังอ่านออก */
html[data-accent] { --day-past-ink: color-mix(in oklab, var(--text-2) 70%, var(--text-3)); }
/* กลางวัน: พื้นป้ายสีเน้นอ่อนลงอีกนิด ให้ตัวอักษรสีเน้นบนป้ายผ่าน AA ทุกธีม */
html[data-accent]:not([data-theme="dark"]) { --accent-soft: color-mix(in oklab, var(--accent) 8%, var(--surface)); --accent-softer: color-mix(in oklab, var(--accent) 4%, var(--surface)); }

/* ================= Base ================= */
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--canvas); color: var(--text);

/* สลับโหมดนุ่มๆ — เปิดเฉพาะตอนกดสลับ (class ใส่ชั่วคราว) เพื่อไม่ให้ทุก hover ช้า */
html.theme-anim, html.theme-anim *, html.theme-anim *::before, html.theme-anim *::after {

}

/* ================= ปุ่มสลับโหมด (ใช้ทั้ง 2 หน้า) ================= */

/* ================= Floating clock · glass pill ================= */
.float-clock {

/* ================= วันสำคัญ / วันหยุดไทย (ใช้ร่วมกันทั้งหน้าบ้าน-หลังร้าน) =================
   สีม่วงชมพู (orchid) แยกจากสีสถานะคิว: ว่าง=เขียว · หลวม=เหลือง · ไม่ว่าง=แดง · พัก=คราม · มือถือ=จุด / จอกว้าง=ชื่อย่อ */
:root { --hol: #9A2F8A; --hol-soft: color-mix(in oklab, #9A2F8A 12%, transparent); }
html[data-theme="dark"] { --hol: #E7A6DC; --hol-soft: color-mix(in oklab, #E7A6DC 16%, transparent); }
.day { position: relative; }

.holtog { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; transition: background-color 120ms var(--ease), border-color 120ms var(--ease), color 120ms var(--ease); }

<script>
/* วันสำคัญ/วันหยุดไทย — ข้อมูลในเครื่อง ไม่ยิง API (ใช้ทั้งหน้าบ้าน หลังร้าน และ GitHub Pages)
   · FIX = วันที่ตายตัวทุกปี [ชื่อเต็ม, ชื่อย่อในช่องปฏิทิน]
   · LUNAR = จันทรคติ: 2569 ตรงปฏิทินทางการ · 2570–2571 คำนวณตามปฏิทินจันทรคติไทย (ราชการยังไม่ประกาศ) ตรวจทานอีกครั้งเมื่อมีประกาศ แก้ได้ที่นี่ที่เดียว */
(function () {
  const FIX = {
    '01-01': ['วันขึ้นปีใหม่', 'ปีใหม่'], '02-14': ['วันวาเลนไทน์', 'วาเลนไทน์'], '04-06': ['วันจักรี', 'วันจักรี'],
    '04-13': ['วันสงกรานต์', 'สงกรานต์'], '04-14': ['วันสงกรานต์', 'สงกรานต์'], '04-15': ['วันสงกรานต์', 'สงกรานต์'],
    '05-01': ['วันแรงงานแห่งชาติ', 'วันแรงงาน'], '05-04': ['วันฉัตรมงคล', 'ฉัตรมงคล'],
    '06-03': ['วันเฉลิมพระชนมพรรษาสมเด็จพระราชินี', 'เฉลิมฯ ราชินี'], '07-28': ['วันเฉลิมพระชนมพรรษา ร.10', 'เฉลิมฯ ร.10'],
    '08-12': ['วันแม่แห่งชาติ', 'วันแม่'], '10-13': ['วันนวมินทรมหาราช', 'นวมินทร์ฯ'], '10-23': ['วันปิยมหาราช', 'ปิยมหาราช'],
    '12-05': ['วันพ่อแห่งชาติ', 'วันพ่อ'], '12-10': ['วันรัฐธรรมนูญ', 'รัฐธรรมนูญ'], '12-25': ['วันคริสต์มาส', 'คริสต์มาส'], '12-31': ['วันสิ้นปี', 'สิ้นปี']
  };
  const LUNAR = {
    2026: { '02-17': 'ตรุษจีน', '03-03': 'มาฆบูชา', '05-31': 'วิสาขบูชา', '07-29': 'อาสาฬหบูชา', '07-30': 'เข้าพรรษา', '11-24': 'ลอยกระทง' },
    2027: { '02-06': 'ตรุษจีน', '02-21': 'มาฆบูชา', '05-20': 'วิสาขบูชา', '07-18': 'อาสาฬหบูชา', '07-19': 'เข้าพรรษา', '11-13': 'ลอยกระทง' },
    2028: { '01-26': 'ตรุษจีน', '03-10': 'มาฆบูชา', '06-07': 'วิสาขบูชา', '08-05': 'อาสาฬหบูชา', '08-06': 'เข้าพรรษา', '12-01': 'ลอยกระทง' }
  };
  const EST = { 2027: 1, 2028: 1 };
  const full = n => n === 'ตรุษจีน' || n === 'ลอยกระทง' ? 'วัน' + n : 'วัน' + n;
  /* คืนรายการวันสำคัญของวันที่ ISO (yyyy-mm-dd): [{ name, short, est }] */
  window.thHolidays = function (iso) {
    const y = Number(String(iso).slice(0, 4)), md = String(iso).slice(5, 10), out = [];
    const l = LUNAR[y] && LUNAR[y][md];
    if (l) out.push({ name: full(l), short: l, est: !!EST[y] });
    if (FIX[md]) out.push({ name: FIX[md][0], short: FIX[md][1], est: false });
    return out;
  };
  window.thHolidayTitle = function (list) { return list.map(h => h.name + (h.est ? ' (วันที่โดยประมาณ)' : '')).join(' · '); };
})();

async function copyText_(text) {

/* เรียกฝั่ง Apps Script: ใน Apps Script ใช้ google.script.run · บน GitHub Pages (build-pages.py ใส่ APP_URL ให้) ใช้ fetch API · เปิดไฟล์เปล่าๆ ใช้ข้อมูลตัวอย่าง */
function runApi_(fn, args) {
  const data = args[0];
  const geo = qs => fetch(APP_URL + '?' + qs, { cache: 'no-store' }).then(r => r.json())
    .then(res => { if (!res || res.ok !== true) throw new Error((res && res.error) || 'ค้นหาสถานที่ไม่สำเร็จ'); return res.data; });
  if (fn === 'getPublicData') return fetch(APP_URL + '?api=public', { cache: 'no-store' }).then(r => r.json());
  if (fn === 'searchPlacesPublic') return geo('api=places&q=' + encodeURIComponent(data || ''));
  if (fn === 'reverseGeocodePublic') return geo('api=reverse&lat=' + encodeURIComponent(args[0]) + '&lng=' + encodeURIComponent(args[1]));
  if (fn === 'submitMessage') {
    const params = new URLSearchParams({ kind: 'msg' });
    Object.keys(data || {}).forEach(k => { if (data[k] != null && data[k] !== '') params.set(k, data[k]); });
    return fetch(APP_URL + '?api=submit&' + params.toString(), { cache: 'no-store' })
      .then(r => r.json())
      .then(res => { if (!res || res.ok !== true) throw new Error((res && res.error) || 'ส่งข้อความไม่สำเร็จ'); return res; });
  }
  if (fn === 'submitRequest') {
    const params = new URLSearchParams();
    Object.keys(data || {}).forEach(k => { if (data[k] != null && data[k] !== '') params.set(k, data[k]); });
    return fetch(APP_URL + '?api=submit&' + params.toString(), { cache: 'no-store' })
      .then(r => r.json())
      .then(res => { if (!res || res.ok !== true) throw new Error((res && res.error) || 'ส่งคำขอไม่สำเร็จ'); return res; });
  }
  return Promise.reject(new Error('unknown fn: ' + fn));
}
function run(fn, ...args) {
  if (!IS_GAS && APP_URL) return runApi_(fn, args);
  return new Promise((res, rej) => {
    if (IS_GAS) return google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(String(e && e.message || e).replace(/^(Error|Exception):\s*/, '')))[fn](...args);
    setTimeout(() => { try { res(PubMock[fn](...args)); } catch (e) { rej(String(e && e.message || e)); } }, fn === 'getPublicData' ? 200 : 450);
  });
}
/* ข้อมูลตัวอย่าง: ใช้เฉพาะตอนเปิดไฟล์นอก Apps Script (ทดสอบเอฟเฟกต์/ธีมได้ด้วย ?fx=snow|fireworks&theme=xmas) */

    if (/ไม่เจอ|zzz/i.test(q)) return [];
    return [mk(q, 'แขวงบางนา เขตบางนา กรุงเทพมหานคร', 13.6683, 100.6046), mk(q + ' สาขา 2', 'ตำบลบางพลีใหญ่ อำเภอบางพลี สมุทรปราการ', 13.6113, 100.7277), mk(q + ' (เขาใหญ่)', 'ตำบลหมูสี อำเภอปากช่อง นครราชสีมา', 14.549, 101.372)];
  },
  reverseGeocodePublic: (lat, lng) => {

const S = { days: {}, today: '', y: 0, m: 0, minKey: 0, maxKey: 0, pick: '', canReq: false, loaded: false, refreshing: false };
const stOf = iso => S.days[iso] || 'free';

function renderCal() {
  const { y, m } = S;
  const first = new Date(Date.UTC(y, m, 1)).getUTCDay();
  const dim = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  let h = TH_D.map(d => '<div class="dow">' + d + '</div>').join('');
  for (let i = 0; i < first; i++) h += '<div class="day blank"></div>';
  let free = 0;
  for (let d = 1; d <= dim; d++) {
    const iso = y + '-' + pad(m + 1) + '-' + pad(d);
    const past = iso < S.today, st = stOf(iso);
    if (!past && st === 'free') free++;
    const ra = S.rA, rb = S.rB;
    const cls = 'day ' + (past ? 'past' : st) + (iso === S.today ? ' today' : '') + (iso === ra || iso === rb ? ' pick' : '') + (ra && rb && iso > ra && iso < rb ? ' inrange' : '');
    const label = d + ' ' + TH_M[m] + (past ? '' : ' ' + LBL[st]);
    const canPick = !past && S.canReq && (st === 'free' || st === 'loose');
    h += (canPick ? '<button type="button" class="' + cls + '" data-pick="' + iso + '" aria-label="' + label + ' แตะเพื่อขอจองคิว">' : '<div class="' + cls + '" aria-label="' + label + '">') +
      '<span class="num">' + d + '</span>' + (past ? '' : '<small>' + LBL[st] + '</small>') + (canPick ? '</button>' : '</div>');
  }
  const key = y * 12 + m;
  $('mTitle').textContent = TH_M[m] + ' ' + (y + 543);
  $('cal').innerHTML = h;
  $('sum').innerHTML = 'เดือนนี้ว่างอีก <b class="num">' + free + '</b> วัน' + (!S.canReq ? '' : S.rA && !S.rB ? '<div class="rangehint" role="status"><span>เลือก <b>' + esc(thFull(S.rA)) + '</b> แล้ว — ถ้าหลายวัน แตะวันสุดท้ายต่อ</span><button type="button" class="btn sm primary" data-jump="1">กรอกรายละเอียด ›</button></div>' : S.rA ? '<div class="rangehint" role="status"><span>ช่วงที่เลือก <b>' + esc(thFull(S.rA)) + ' – ' + esc(thFull(S.rB)) + '</b></span><button type="button" class="btn sm" data-rclear="1">ล้าง</button></div>' : '<div class="hint">แตะวันที่ว่างหรือคิวหลวมเพื่อขอจองคิว · แตะวันแรกแล้ววันสุดท้ายเพื่อจองหลายวัน</div>');

  $('next').disabled = key >= S.maxKey;
}

  const split = p.showCalendar !== 'no' && (S.canReq || gearH || credH);

      '<span><i style="background:var(--rose-soft);border:1px solid var(--rose)"></i>' + esc(LBL.lock) + '</span><span><i style="background:var(--rest-soft);border:1px solid var(--rest)"></i>' + esc(LBL.off) + '</span></div></section>';

  S.days = d.days || {}; S.today = /^\d{4}-\d{2}-\d{2}$/.test(String(d.today || '')) ? d.today : fallbackToday; S.pick = '';
  const [ty, tm] = S.today.split('-').map(Number);
  S.minKey = ty * 12 + tm - 1; S.maxKey = S.minKey + 12;
  const curKey = S.y * 12 + S.m;
  if (!S.loaded || curKey < S.minKey || curKey > S.maxKey) { S.y = ty; S.m = tm - 1; }
  if (!S.loaded) { const mq = /^(\d{4})-(\d{2})$/.exec(pageParam_('m')); if (mq) { const k = Number(mq[1]) * 12 + Number(mq[2]) - 1; if (Number(mq[2]) >= 1 && Number(mq[2]) <= 12 && k >= S.minKey && k <= S.maxKey) { S.y = Number(mq[1]); S.m = Number(mq[2]) - 1; } } }

/* ---------- 🎬 Selected Credits ---------- */
const CRED_TYPES = ['MV', 'โฆษณา', 'ซีรีส์', 'หนัง', 'หนังสั้น', 'Live-session'];
function parseCredits_(raw) {
  let a = []; try { a = JSON.parse(raw || '[]'); } catch (e) { a = []; }
  return (Array.isArray(a) ? a : []).filter(c => c && c.title).map(c => ({ year: String(c.year || ''), title: String(c.title), artist: String(c.artist || ''), type: CRED_TYPES.includes(c.type) ? c.type : 'MV', roles: (Array.isArray(c.roles) ? c.roles : String(c.roles || '').split(',')).map(r => String(r).trim()).filter(Boolean), house: String(c.house || ''), url: /^https?:\/\//i.test(String(c.url || '')) ? String(c.url) : '' }))
    .sort((a, b) => (Number(b.year) || 0) - (Number(a.year) || 0));
}
function renderCredits() {
  const box = $('credBody'); if (!box) return;
  if (!CRED_TYPES.includes(S.credF)) S.credF = 'all';
  const types = CRED_TYPES.filter(t => S.credits.some(c => c.type === t));
  const list = S.credF === 'all' ? S.credits : S.credits.filter(c => c.type === S.credF);
  const shown = S.credAll ? list : list.slice(0, 5);
  const cnt = t => t === 'all' ? S.credits.length : S.credits.filter(c => c.type === t).length;
  box.innerHTML = (types.length > 1 ? '<div class="cr-filter" role="group" aria-label="กรองประเภทผลงาน">' + ['all'].concat(types).map(t => '<button type="button" data-crf="' + esc(t) + '" aria-pressed="' + (S.credF === t) + '">' + (t === 'all' ? 'ทั้งหมด' : esc(t)) + ' <span style="opacity:.6">' + cnt(t) + '</span></button>').join('') + '</div>' : '') +
    '<ul class="cr-list">' + shown.map(c => '<li><span class="cr-y">' + esc(c.year || '–') + '</span><div class="cr-main"><div class="cr-t">' + esc(c.title) + (c.artist ? '<span class="cr-art"> — ' + esc(c.artist) + '</span>' : '') + '</div>' +
      '<div class="cr-sub">' + esc(c.type) + (c.house ? '<span class="dot">·</span>' + esc(c.house) : '') + '</div>' +
      (c.roles.length ? '<div class="cr-roles">' + c.roles.map(r => '<span class="cr-role">' + esc(r) + '</span>').join('') + '</div>' : '') + '</div>' +
      (c.url ? '<a class="cr-go" href="' + esc(c.url) + '" target="_blank" rel="noopener noreferrer" aria-label="ดูงาน ' + esc(c.title) + '"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1l7 4-7 4z" fill="currentColor"/></svg>ดูงาน</a>' : '<span></span>') + '</li>').join('') +
    '</ul>' +
    (list.length > 5 ? '<button type="button" class="cr-more" data-crmore="1">' + (S.credAll ? 'ย่อรายการ' : 'ดูผลงานทั้งหมด (' + list.length + ')') + '</button>' : '');
  box.onclick = e => {
    const f = e.target.closest('[data-crf]'); if (f) { S.credF = f.dataset.crf; S.credAll = false; return renderCredits(); }
    if (e.target.closest('[data-crmore]')) { S.credAll = !S.credAll; renderCredits(); }
  };
}

function checkDates() {
  const s = $('r_date').value, e = $('r_end').value || s;
  if (!s) { $('r_state').innerHTML = ''; S.rA = S.rB = ''; if ($('cal')) renderCal(); return; }
  const clr = () => { S.rA = S.rB = ''; if ($('cal')) renderCal(); };
  if (s < S.today) { $('r_state').innerHTML = '<div class="msg bad">เลือกได้ตั้งแต่วันนี้เป็นต้นไป</div>'; return clr(); }
  if (e < s) { $('r_state').innerHTML = '<div class="msg bad">“ถึงวันที่” ต้องไม่ก่อนวันเริ่ม</div>'; return clr(); }
  const bad = [], looses = [];
  for (let d = s, n = 0; d <= e && n < 62; n++) {
    const st = stOf(d);
    if (st === 'lock' || st === 'off') bad.push(thFull(d) + ' ' + LBL[st]);
    else if (st === 'loose') looses.push(thFull(d));
    const p = d.split('-').map(Number); d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + 1)).toISOString().slice(0, 10);
  }
  $('r_state').innerHTML = bad.length ? '<div class="msg warn">' + esc(bad.slice(0, 3).join(', ')) + (bad.length > 3 ? ' …' : '') + ' — ส่งคำขอได้ แต่คิวอาจไม่ว่าง</div>'
    : looses.length ? '<div class="msg warn">' + (looses.length === 1 && s === e ? 'วันนี้มีคิวหลวมอยู่' : 'ช่วงที่เลือกมีคิวหลวม (' + esc(looses.slice(0, 3).join(', ')) + (looses.length > 3 ? ' …' : '') + ')') + ' ส่งเป็นคิวสำรองไว้ได้</div>'
    : '<div class="msg ok">วันที่เลือกว่าง ✓</div>';
  S.pick = s; S.rA = s; S.rB = e > s ? e : ''; if ($('cal')) renderCal();
}

/* ===== ลดการกรอก: จำข้อมูล PM ในเครื่องลูกค้า + ปุ่มลัด Call time ===== */

function pmClear_() { try { localStorage.removeItem(PM_KEY); } catch (e) { /* ไม่เป็นไร */ } }
function pmShow_(pm, qh) {

  if (qh) $('r_house').value = qh;

    '<span class="pmbtns"><button type="button" class="btn sm" data-pm="edit">แก้</button><button type="button" class="btn sm" data-pm="forget">ไม่ใช่ฉัน</button></span>';
  hello.hidden = false; fields.hidden = true;
}

function wireForm() {
  $('r_date').min = S.today; $('r_end').min = S.today;
  const qh = pageParam_('house').trim().slice(0, 120);
  pmShow_(pmLoad_(), qh);
  ['r_date', 'r_end'].forEach(id => { $(id).addEventListener('input', checkDates); $(id).addEventListener('change', checkDates); });
  rPlaceBind_();
  $('reqForm').addEventListener('submit', async e => {
    e.preventDefault();
    const v = id => $(id).value.trim();
    const bad = (m, id) => { $('r_msg').innerHTML = '<div class="msg bad">' + m + '</div>'; if (id) { if ($('r_pmFields').contains($(id))) { $('r_pmFields').hidden = false; $('r_pmHello').hidden = true; } $(id).focus(); } };
    if (!v('r_date')) return bad('เลือกวันออกกองก่อน', 'r_date');
    if (v('r_end') && v('r_end') < v('r_date')) return bad('“ถึงวันที่” ต้องไม่ก่อนวันเริ่ม', 'r_end');
    if (!v('r_name')) return bad('ใส่ชื่อ PM หรือผู้ประสานงานก่อนส่ง', 'r_name');
    if (!v('r_phone') && !v('r_line')) return bad('ใส่เบอร์โทรหรือ LINE อย่างน้อย 1 ช่อง จะได้ทักกลับได้', 'r_phone');
    const loc = v('r_loc'), isUrl = /^https:\/\//i.test(loc), pin = (S.rPlace && S.rPlace.mapUrl) || (isUrl ? loc : '');
    $('r_send').disabled = true; $('r_send').textContent = 'กำลังส่ง…'; $('r_msg').innerHTML = '';
    const reqDate = v('r_date'), reqEnd = v('r_end'), reqQ = (document.querySelector('input[name="r_queue"]:checked') || {}).value || 'lock';
    try {
      pmSave_({ name: v('r_name'), house: v('r_house'), phone: v('r_phone'), line: v('r_line') });
      await run('submitRequest', { date: reqDate, endDate: reqEnd, time: '', house: v('r_house'), name: v('r_name'), phone: v('r_phone'), line: v('r_line'), location: isUrl ? '' : loc, mapUrl: pin, detail: v('r_detail'), website: v('r_web'), queue: reqQ });
      $('reqCard').innerHTML = '<div class="done"><div class="ic">✓</div><h2 style="font-size:1.2rem">ได้รับคำขอจองคิวแล้ว</h2><p class="hint">ขอคิววันที่ ' + esc(thFull(reqDate)) + (reqEnd ? ' – ' + esc(thFull(reqEnd)) : '') + '<br>แบบ: ' + (reqQ === 'loose' ? 'คิวหลวม' : '🔒 ล็อกคิว') + '<br>เดี๋ยวทักกลับเพื่อคอนเฟิร์มคิวโดยเร็ว</p><button type="button" class="btn" data-refresh="1" style="margin-top:8px">รีเฟรชหน้านี้</button></div>';
    } catch (err) { $('r_send').disabled = false; $('r_send').textContent = 'ส่งคำขอจองคิว'; bad(esc(err)); }
  });
}

/* ===== ค้นหาสถานที่ + แผนที่ในฟอร์มขอจองคิว (ไม่ใช้ Maps API Key: ค้นผ่าน Apps Script · แผนที่ฝังแบบ output=embed) ===== */
const PUB_PLACE_CACHE = new Map();   // คำค้น → ผลลัพธ์ (อยู่ตลอดการเปิดหน้า ไม่ยิงซ้ำ)
const P_ICON = {
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  here: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>'
};
const isLink_ = s => /^https?:\/\//i.test(String(s || ''));
const MAP_HIDE_KEY = 'wk_pub_map_hide';

/* ตำแหน่งปัจจุบันของลูกค้า: GPS ก่อน ถ้าไม่ได้ใช้ตำแหน่งโดยประมาณจากอินเทอร์เน็ต */
function pubGps_() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej('no-gps');
    navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lng: p.coords.longitude }),
      e => rej(e && e.message || 'denied'), { enableHighAccuracy: true, timeout: 9000, maximumAge: 300000 });
  });
}
async function pubPosition_() {
  try { return await pubGps_(); } catch (e) { /* ลองตำแหน่งโดยประมาณ */ }
  for (const u of ['https://ipapi.co/json/', 'https://ipwho.is/']) {
    try {
      const j = await (await fetch(u)).json();
      const lat = Number(j.latitude), lng = Number(j.longitude);
      if (isFinite(lat) && isFinite(lng) && (lat || lng)) return { lat, lng, approx: true };
    } catch (e) { /* ลองที่ถัดไป */ }
  }
  throw new Error('หาตำแหน่งปัจจุบันไม่ได้');
}

function rPlaceBind_() {
  const loc = $('r_loc'), res = $('r_placeRes'), btn = $('r_placeBtn'), box = $('r_mapBox');
  if (!loc || !res) return;
  S.rPlace = { name: '', mapUrl: '' }; S.rItems = []; S.rIdx = -1; S.rLocating = false; S.rLoading = ''; S.rErr = null;
  try { S.rMapHide = localStorage.getItem(MAP_HIDE_KEY) === '1'; } catch (e) { S.rMapHide = false; }
  res.addEventListener('mousedown', e => e.preventDefault());   // กดรายการแล้วโฟกัสยังอยู่ที่ช่องพิมพ์
  res.addEventListener('click', e => { const b = e.target.closest('.pr-item'); if (b && res.contains(b)) rPlacePick_(Number(b.dataset.i)); });
  loc.addEventListener('focus', () => rPlaceRender_(loc.value.trim()));
  loc.addEventListener('click', () => { if (res.hidden) rPlaceRender_(loc.value.trim()); });
  loc.addEventListener('keydown', e => {
    if (e.isComposing) return;
    const open = !res.hidden, n = S.rItems.length;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!open) { rPlaceRender_(loc.value.trim()); return; }
      if (n) rPlaceHi_(e.key === 'ArrowDown' ? (S.rIdx + 1) % n : (S.rIdx <= 0 ? n - 1 : S.rIdx - 1));
    } else if (e.key === 'Enter') {
      e.preventDefault();   // ห้ามส่งฟอร์มจากช่องนี้
      if (open && S.rIdx >= 0) rPlacePick_(S.rIdx); else rPlaceSearch_();
    } else if (e.key === 'Escape' && open) {
      e.preventDefault(); e.stopPropagation(); rPlaceClose_();   // ปิดเฉพาะ Dropdown
    } else if (e.key === 'Tab') rPlaceClose_();
  });
  let st = 0;
  loc.addEventListener('input', () => {
    const q = loc.value.trim();
    clearTimeout(st);
    if (!q && S.rPlace.mapUrl) { S.rPlace = { name: '', mapUrl: '' }; rMapRender_(); }
    rPlaceRender_(q);
    if (isLink_(q)) st = setTimeout(() => rPlaceLink_(q), 400);
    else if (q.length >= 3 && !PUB_PLACE_CACHE.has(q)) st = setTimeout(() => rPlaceRemote_(q), 600);
  });
  if (btn) btn.addEventListener('click', rPlaceSearch_);
  if (box) box.addEventListener('click', e => {
    if (!e.target.closest('[data-maptog]')) return;
    S.rMapHide = !S.rMapHide;
    try { S.rMapHide ? localStorage.setItem(MAP_HIDE_KEY, '1') : localStorage.removeItem(MAP_HIDE_KEY); } catch (err) {}
    rMapRender_();
  });
  if (!S.rDocBound) {
    S.rDocBound = true;
    document.addEventListener('pointerdown', e => {
      const w = $('r_placeWrap'), r = $('r_placeRes');
      if (w && r && !r.hidden && !w.contains(e.target)) rPlaceClose_();
    });
  }
}

function rPlaceClose_() {
  const r = $('r_placeRes'); if (r) { r.hidden = true; r.innerHTML = ''; }
  const loc = $('r_loc'); if (loc) { loc.setAttribute('aria-expanded', 'false'); loc.removeAttribute('aria-activedescendant'); }
  S.rItems = []; S.rIdx = -1;
}

function rPlaceRender_(q, force) {
  const res = $('r_placeRes'), loc = $('r_loc'); if (!res || !loc) return;
  const link = isLink_(q), want = !link && (force || q.length >= 3);
  const list = want ? PUB_PLACE_CACHE.get(q) : null;
  const here = { kind: 'here', name: 'ใช้ตำแหน่งปัจจุบันของฉัน', address: S.rLocating ? 'กำลังระบุตำแหน่ง…' : 'ใช้ GPS ของเครื่องนี้ แล้วแสดงชื่อเขตพร้อมหมุดแผนที่' };
  const found = Array.isArray(list) ? list.slice(0, 5).map(p => ({ kind: 'new', name: p.name, address: p.address || '', mapUrl: p.mapUrl || '' })) : [];
  S.rItems = [here].concat(found); S.rIdx = -1;
  const icon = p => p.kind === 'here' ? (S.rLocating ? '<i class="cs-spin" aria-hidden="true"></i>' : P_ICON.here) : P_ICON.pin;
  const opt = i => { const p = S.rItems[i]; return '<button type="button" tabindex="-1" class="pr-item' + (p.kind === 'here' ? ' pr-here' : '') + '" role="option" id="r-o' + i + '" aria-selected="false" data-i="' + i + '">' +
    icon(p) + '<span class="pr-t"><b>' + esc(p.name) + '</b><span>' + esc(p.address) + '</span></span></button>'; };
  const note = (t, cls) => '<div class="pr-note' + (cls ? ' ' + cls : '') + '">' + t + '</div>';
  let h = opt(0);
  if (link) {
    h += S.rLoading === q ? note('<i class="cs-spin" aria-hidden="true"></i>กำลังอ่านตำแหน่งจากลิงก์…')
      : S.rErr && S.rErr.q === q ? note(esc(S.rErr.msg), 'pr-err') : note('วางลิงก์แล้ว ระบบจะอ่านตำแหน่งให้อัตโนมัติ');
  } else if (want) {
    h += '<div class="pr-head" role="presentation">' + P_ICON.search + 'ผลการค้นหา</div>';
    if (S.rLoading === q && !list) h += note('<i class="cs-spin" aria-hidden="true"></i>กำลังค้นหา “' + esc(q) + '”…');
    else if (S.rErr && S.rErr.q === q) h += note(esc(S.rErr.msg) + ' — กดปุ่มค้นหาเพื่อลองใหม่', 'pr-err');
    else if (Array.isArray(list)) h += found.length ? found.map((p, k) => opt(k + 1)).join('') : note('ไม่พบสถานที่นี้ ลองเพิ่มชื่อเขต/อำเภอ/จังหวัด หรือวางลิงก์ Google Maps');
    else h += note('หยุดพิมพ์สักครู่ ระบบจะค้นหาให้อัตโนมัติ');
  } else if (q) {
    h += note('พิมพ์อย่างน้อย 3 ตัวอักษรเพื่อค้นหาสถานที่');
  }
  res.innerHTML = h; res.hidden = false; res.scrollTop = 0;
  loc.setAttribute('aria-expanded', 'true'); loc.removeAttribute('aria-activedescendant');
}

function rPlaceHi_(i) {
  const res = $('r_placeRes'), loc = $('r_loc'); if (!res) return;
  S.rIdx = i;
  res.querySelectorAll('.pr-item').forEach(el => { const on = el.id === 'r-o' + i; el.classList.toggle('on', on); el.setAttribute('aria-selected', on); if (on) el.scrollIntoView({ block: 'nearest' }); });
  loc.setAttribute('aria-activedescendant', 'r-o' + i);
}

async function rPlaceRemote_(q, force) {
  if (!PUB_PLACE_CACHE.has(q)) {
    S.rLoading = q; S.rErr = null;
    if ($('r_loc') && $('r_loc').value.trim() === q) rPlaceRender_(q, force);
    try { const list = await run('searchPlacesPublic', q); PUB_PLACE_CACHE.set(q, Array.isArray(list) ? list : []); }
    catch (err) { S.rErr = { q, msg: String(err && err.message || err) }; }   // ไม่แคชข้อผิดพลาด จะได้ลองใหม่ได้
    if (S.rLoading === q) S.rLoading = '';
  }
  const loc = $('r_loc'), res = $('r_placeRes');
  if (!loc || loc.value.trim() !== q || (!force && res.hidden)) return;
  rPlaceRender_(q, force);
}

/* ลิงก์ Google Maps ที่วางเอง → ให้ Server อ่านพิกัด (รวมลิงก์ย่อ maps.app.goo.gl) แล้วเติมชื่อ + หมุด */
async function rPlaceLink_(url) {
  const loc = $('r_loc'); if (!loc) return;
  S.rLoading = url; S.rErr = null; rPlaceRender_(url);
  let p = null;
  try { p = ((await run('searchPlacesPublic', url)) || [])[0] || null; }
  catch (err) { S.rErr = { q: url, msg: String(err && err.message || err) }; }
  if (S.rLoading === url) S.rLoading = '';
  if (loc.value.trim() !== url) return;
  if (p) { rPlaceApply_(p.name || 'ตำแหน่งจากลิงก์แผนที่', p.mapUrl || url, 'อ่านตำแหน่งจากลิงก์แล้ว — ตรวจหมุดในแผนที่'); return; }
  S.rPlace = { name: '', mapUrl: /^https:\/\//i.test(url) ? url : '' };   // อ่านไม่ได้ก็ยังส่งลิงก์เดิมไปให้
  rPlaceRender_(url); rMapRender_();
}

/* ปุ่ม "ค้นหาสถานที่" / Enter: ค้นหาทันทีไม่ต้องรอ */
async function rPlaceSearch_() {
  const loc = $('r_loc'), btn = $('r_placeBtn'); if (!loc) return;
  const q = loc.value.trim();
  if (!q) { loc.focus(); toast('พิมพ์ชื่อสถานที่ก่อนค้นหา'); return; }
  if (isLink_(q)) return rPlaceLink_(q);
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="cs-spin" aria-hidden="true"></i>กำลังค้นหา…'; }
  try { await rPlaceRemote_(q, true); }
  finally { if (btn) { btn.disabled = false; btn.textContent = '🔎 ค้นหาสถานที่'; } }
}

function rPlaceApply_(name, mapUrl, msg) {
  const loc = $('r_loc'); if (!loc) return;
  loc.value = name;
  S.rPlace = { name, mapUrl: mapUrl || '' };
  rPlaceClose_();
  if (S.rPlace.mapUrl && S.rMapHide) { S.rMapHide = false; try { localStorage.removeItem(MAP_HIDE_KEY); } catch (e) {} }
  rMapRender_();
  if (msg) toast(msg);
}

function rPlacePick_(i) {
  const p = S.rItems[i]; if (!p) return;
  if (p.kind === 'here') return rPlaceHere_();
  rPlaceApply_(p.name, p.mapUrl, 'เลือก “' + p.name + '” แล้ว — ตรวจหมุดในแผนที่');
}

async function rPlaceHere_() {
  if (S.rLocating) return;
  S.rLocating = true;
  const loc = $('r_loc'); rPlaceRender_(loc ? loc.value.trim() : '');
  try {
    const pos = await pubPosition_();
    const lat = Math.round(pos.lat * 1e5) / 1e5, lng = Math.round(pos.lng * 1e5) / 1e5;
    let place = null;
    try { place = await run('reverseGeocodePublic', lat, lng); } catch (e) { /* ใช้พิกัดอย่างเดียว */ }
    S.rLocating = false;
    rPlaceApply_((place && place.name) || 'ตำแหน่งปัจจุบัน (' + lat + ', ' + lng + ')',
      'https://www.google.com/maps/search/?api=1&query=' + lat + ',' + lng,
      pos.approx ? 'ใช้ตำแหน่งโดยประมาณ (เครื่องไม่อนุญาต GPS) — ตรวจหมุดและแก้ชื่อได้' : 'ใส่ตำแหน่งปัจจุบันแล้ว — แก้ชื่อสถานที่ต่อได้');
  } catch (e) {
    toast('หาตำแหน่งปัจจุบันไม่ได้ — อนุญาตการเข้าถึงตำแหน่ง หรือพิมพ์ชื่อสถานที่แทน');
  } finally {
    if (S.rLocating) { S.rLocating = false; const r = $('r_placeRes'); if (r && !r.hidden && loc) rPlaceRender_(loc.value.trim()); }
  }
}

/* พิกัดจากลิงก์ (query=lat,lng หรือ @lat,lng) ใช้ปักหมุดตรงจุด · ไม่มีก็ใช้ชื่อสถานที่ */
function rMapQ_(name, url) {
  const m = /[?&](?:q|query)=(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/.exec(url || '') || /@(-?\d+\.\d+),(-?\d+\.\d+)/.exec(url || '');
  if (m) return m[1] + ',' + m[2];
  return name && !isLink_(name) ? name : '';
}

function rMapRender_() {
  const box = $('r_mapBox'); if (!box) return;
  const pl = S.rPlace || {}, q = pl.mapUrl ? rMapQ_(pl.name, pl.mapUrl) : '';
  if (!q) { box.innerHTML = ''; box.dataset.k = ''; return; }
  const k = q + '|' + (S.rMapHide ? 0 : 1);
  if (box.dataset.k === k) return;   // ตำแหน่งเดิม ไม่โหลด iframe ซ้ำ
  box.dataset.k = k;
  const label = pl.name || 'ตำแหน่งที่เลือก';
  box.innerHTML = '<div class="mapbar"><span class="hint">' + P_ICON.pin + ' ' + esc(label.length > 48 ? label.slice(0, 48) + '…' : label) + '</span>' +
    '<button type="button" class="btn sm" data-maptog="1" aria-expanded="' + !S.rMapHide + '">' + (S.rMapHide ? 'แสดงแผนที่' : 'ซ่อนแผนที่') + '</button></div>' +
    (S.rMapHide ? '' : '<div class="mapembed"><iframe src="https://maps.google.com/maps?q=' + encodeURIComponent(q) + '&hl=th&z=15&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="แผนที่: ' + esc(label) + '"></iframe>' +
      '<a class="me-open" href="' + esc(pl.mapUrl) + '" target="_blank" rel="noopener">' + P_ICON.pin.replace('<svg ', '<svg width="14" height="14" ') + ' เปิดใน Google Maps</a></div>');
}

/* ===== 🎉 เอฟเฟกต์เทศกาล (พลุ / หิมะ) — Canvas เลเยอร์เดียว ไม่รับคลิก
   · มือถือลดอนุภาคเหลือ ~55% · ปิดเมื่อ prefers-reduced-motion · หยุดวาดเมื่อแท็บถูกซ่อน · สีตามโหมดสว่าง/มืด ===== */
const PubFx = (() => {
  let cv = null, ctx = null, kind = '', raf = 0, last = 0, W = 0, H = 0, dpr = 1, mobile = false, dark = false;
  let flakes = [], sprites = {}, rockets = [], sparks = [], nextShot = 0;
  const rm = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const rnd = (a, b) => a + Math.random() * (b - a);
  const TAU = Math.PI * 2;

  function ensureCanvas() {
    if (cv) return;
    cv = document.createElement('canvas'); cv.className = 'pub-fx'; cv.setAttribute('aria-hidden', 'true');
    document.body.appendChild(cv); ctx = cv.getContext('2d');
    window.addEventListener('resize', () => { if (kind) { size(); if (kind === 'snow') seedSnow(); } }, { passive: true });
    document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); else if (kind) start(); });
    new MutationObserver(() => { if (kind) { readTheme(); } }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'data-accent'] });
    const onRm = () => set(kind);
    rm.addEventListener ? rm.addEventListener('change', onRm) : rm.addListener && rm.addListener(onRm);
  }
  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 1.5); /* จอ Retina/มือถือ: 1.5 พอสำหรับหิมะ/พลุ ลดงาน GPU เกือบครึ่ง */
    W = window.innerWidth; H = window.innerHeight; mobile = W < 640;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function accent() {
    const v = getComputedStyle(document.documentElement).getPropertyValue(dark ? '--accent-d' : '--accent-l').trim();
    return /^#[0-9a-f]{6}$/i.test(v) ? v : (dark ? '#9cc3ee' : '#6f9fd3');
  }
  function readTheme() {
    dark = document.documentElement.dataset.theme === 'dark';
    sprites = {
      far: sprite(dark ? 'rgba(232,242,255,1)' : 'rgba(150,186,226,1)', 3, 0),
      mid: sprite(dark ? 'rgba(236,245,255,1)' : 'rgba(160,194,232,1)', 7, 0.55),
      near: sprite(dark ? 'rgba(240,247,255,1)' : 'rgba(170,200,236,1)', 14, 0.75)
    };
  }
  /* วาดเกล็ดหิมะครั้งเดียวลง Canvas เล็ก แล้วใช้ซ้ำทุกเฟรม (เร็วกว่าไล่สีทุกเม็ด) · soft = ความฟุ้งของขอบ */
  function sprite(color, r, soft) {
    const s = document.createElement('canvas'), R = Math.ceil(r * 2 + 4), c = s.getContext('2d');
    s.width = s.height = R * 2;
    const g = c.createRadialGradient(R, R, 0, R, R, r * (1 + soft));
    g.addColorStop(0, color); g.addColorStop(soft ? 0.35 : 0.7, color); g.addColorStop(1, color.replace(/,1\)$/, ',0)'));
    c.fillStyle = g; c.beginPath(); c.arc(R, R, r * (1 + soft), 0, TAU); c.fill();
    if (!dark) { c.globalCompositeOperation = 'destination-over'; c.fillStyle = 'rgba(70,100,140,.10)'; c.beginPath(); c.arc(R + 0.6, R + 0.8, r * 0.9, 0, TAU); c.fill(); }
    return { img: s, half: R };
  }

  /* ---------- หิมะ: 3 ระยะความลึก ---------- */
  const LAYERS = {
    far:  { share: 0.58, size: [0.35, 0.55], vy: [10, 18],  amp: [4, 9],   op: [0.20, 0.35] },
    mid:  { share: 0.34, size: [0.45, 0.7],  vy: [20, 32],  amp: [8, 16],  op: [0.45, 0.65] },
    near: { share: 0.08, size: [0.32, 0.48], vy: [34, 48],  amp: [14, 24], op: [0.22, 0.34] }
  };
  function flake(layer, anyY) {
    const L = LAYERS[layer];
    return { layer, x: rnd(0, W), y: anyY ? rnd(-H * 0.1, H) : rnd(-60, -10), s: rnd(L.size[0], L.size[1]), vy: rnd(L.vy[0], L.vy[1]),
      amp: rnd(L.amp[0], L.amp[1]), f: rnd(0.15, 0.4), ph: rnd(0, TAU), op: rnd(L.op[0], L.op[1]) * (dark ? 1 : 0.8) };
  }
  function seedSnow() {
    const total = Math.round(Math.min(110, (W * H) / 14000) * (mobile ? 0.55 : 1));
    flakes = [];
    Object.keys(LAYERS).forEach(k => { const n = k === 'near' ? Math.min(mobile ? 3 : 6, Math.round(total * LAYERS[k].share)) : Math.round(total * LAYERS[k].share); for (let i = 0; i < n; i++) flakes.push(flake(k, true)); });
  }
  function drawSnow(dt, t) {
    for (const p of flakes) {
      p.y += p.vy * dt;
      const sx = Math.sin(t * p.f + p.ph) * p.amp;
      if (p.y > H + 30) Object.assign(p, flake(p.layer, false));
      const sp = sprites[p.layer], d = sp.half * 2 * p.s;
      ctx.globalAlpha = p.op;
      ctx.drawImage(sp.img, p.x + sx - d / 2, p.y - d / 2, d, d);
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- พลุ: ยิงทีละ 1–2 ลูก ทุก 2.5–4.5 วิ แตกช่วงบนจอ/ขอบซ้าย-ขวา หลบโซนอ่านตรงกลาง ---------- */
  function palette() {
    return dark ? ['#f3dcaa', '#fff3e0', '#c4dcf4', '#f6c9b4', accent()] : ['#d4ae6a', '#e8a184', '#86aedb', '#c99a7a', accent()];
  }
  function burstPoint() {
    const col = Math.min(600, W);                       // คอลัมน์เนื้อหา (.wrap max-width 600px)
    const side = (W - col) / 2;
    if (side > 120 && Math.random() < 0.75) {           // จอกว้าง: แตกที่ขอบซ้าย/ขวานอกคอลัมน์
      const left = Math.random() < 0.5;
      return { x: left ? rnd(side * 0.2, side * 0.85) : W - rnd(side * 0.2, side * 0.85), y: rnd(H * 0.1, H * 0.42) };
    }
    return { x: rnd(W * 0.12, W * 0.88), y: rnd(H * 0.06, H * 0.2) };   // จอแคบ: แตกช่วงบนสุดของจอ
  }
  function launch() {
    const n = Math.random() < 0.35 ? 2 : 1, cols = palette();
    for (let i = 0; i < n; i++) {
      const b = burstPoint(), sx = b.x + rnd(-40, 40), sy = H + 10, dur = rnd(1.1, 1.5);
      rockets.push({ x: sx, y: sy, sx, sy, tx: b.x, ty: b.y, t: -i * rnd(0.25, 0.5), dur, col: cols[Math.floor(Math.random() * cols.length)], trail: [] });
    }
    nextShot = rnd(2.5, 4.5);
  }
  function explode(r) {
    const count = Math.round(rnd(42, 60) * (mobile ? 0.55 : 1)), cols = palette(), alt = cols[Math.floor(Math.random() * cols.length)];
    const speed = rnd(70, 105) * (mobile ? 0.75 : 1);
    for (let i = 0; i < count; i++) {
      const a = (i / count) * TAU + rnd(-0.08, 0.08), v = speed * rnd(0.55, 1);
      sparks.push({ x: r.x, y: r.y, px: r.x, py: r.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: rnd(1.4, 2.2), col: Math.random() < 0.7 ? r.col : alt, tw: rnd(0, TAU), hist: [] });
    }
  }
  function drawFireworks(dt) {
    const peak = dark ? 0.7 : 0.5;
    ctx.globalCompositeOperation = dark ? 'lighter' : 'source-over';
    nextShot -= dt; if (nextShot <= 0) launch();
    ctx.lineCap = 'round';
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i]; r.t += dt; if (r.t < 0) continue;
      const k = Math.min(1, r.t / r.dur), e = 1 - Math.pow(1 - k, 3);   // ease-out: ช้าลงก่อนแตก
      r.x = r.sx + (r.tx - r.sx) * e; r.y = r.sy + (r.ty - r.sy) * e;
      r.trail.push([r.x, r.y]); if (r.trail.length > 10) r.trail.shift();
      for (let j = 1; j < r.trail.length; j++) {
        ctx.globalAlpha = peak * 0.5 * (j / r.trail.length) * (1 - k * 0.5);
        ctx.strokeStyle = r.col; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(r.trail[j - 1][0], r.trail[j - 1][1]); ctx.lineTo(r.trail[j][0], r.trail[j][1]); ctx.stroke();
      }
      if (k >= 1) { explode(r); rockets.splice(i, 1); }
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i]; s.life += dt;
      if (s.life >= s.max) { sparks.splice(i, 1); continue; }
      const drag = Math.pow(0.32, dt);                   // แรงต้านอากาศ
      s.vx *= drag; s.vy = s.vy * drag + 42 * dt;         // แรงโน้มถ่วงโค้งลง
      s.x += s.vx * dt; s.y += s.vy * dt;
      s.hist.push([s.x, s.y]); if (s.hist.length > 6) s.hist.shift();
      const lifeK = s.life / s.max, fade = 1 - lifeK * lifeK;
      const twinkle = lifeK > 0.55 ? 0.55 + 0.45 * Math.abs(Math.sin(s.tw + s.life * 18)) : 1;
      const a = peak * fade * twinkle;
      ctx.strokeStyle = s.col; ctx.lineWidth = 1.4;
      for (let j = 1; j < s.hist.length; j++) {           // หางประกายนุ่มๆ
        ctx.globalAlpha = a * (j / s.hist.length) * 0.6;
        ctx.beginPath(); ctx.moveTo(s.hist[j - 1][0], s.hist[j - 1][1]); ctx.lineTo(s.hist[j][0], s.hist[j][1]); ctx.stroke();
      }
      ctx.globalAlpha = a; ctx.fillStyle = s.col;
      ctx.beginPath(); ctx.arc(s.x, s.y, 1.3, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }

  function frame(now) {
    raf = requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - (last || now)) / 1000); last = now;
    ctx.clearRect(0, 0, W, H);
    if (kind === 'snow') drawSnow(dt, now / 1000); else drawFireworks(dt);
  }
  function start() { if (!raf && kind && !document.hidden) { last = 0; raf = requestAnimationFrame(frame); } }
  function stop() { if (raf) cancelAnimationFrame(raf); raf = 0; }
  function set(k) {
    k = k === 'snow' || k === 'fireworks' ? k : '';
    if (!k || rm.matches) { kind = k; stop(); if (cv) { ctx.clearRect(0, 0, W, H); cv.hidden = true; } return; }
    ensureCanvas(); cv.hidden = false;
    const changed = k !== kind; kind = k;
    if (changed) { size(); readTheme(); rockets = []; sparks = []; nextShot = 0.6; if (k === 'snow') seedSnow(); }
    start();
  }
  return { set };
})();

/* พารามิเตอร์ของหน้า (?m= ?house=): บน GitHub Pages อ่านจาก URL ตรง ๆ · ใน Apps Script (/exec อยู่ใน iframe) อ่านผ่าน google.script.url */
let PAGE_QP = new URLSearchParams(location.search);
const pageParam_ = k => String(PAGE_QP.get(k) || '');
const pageQpReady_ = new Promise(res => {
  setTimeout(res, 1200); /* กันค้าง: ถ้าอ่านไม่ได้ก็โหลดหน้าไปก่อน */
  try {
    if (window.google && google.script && google.script.url) return google.script.url.getLocation(l => { const o = (l && l.parameter) || {}; const q = new URLSearchParams(location.search); Object.keys(o).forEach(k => { if (!q.has(k)) q.set(k, o[k]); }); PAGE_QP = q; res(); });
  } catch (e) { /* ไม่ใช่ Apps Script */ }
  res();
});
/* เปิดหน้าติดทันที (stale-while-revalidate): วาดจากข้อมูลชุดล่าสุดในเครื่องก่อน แล้วดึงของจริงมาอัปเดตเงียบ ๆ
 * ถ้าลูกค้าเริ่มแตะ/พิมพ์แล้ว จะอัปเดตเฉพาะปฏิทิน ไม่สร้างฟอร์มใหม่ (ข้อมูลที่กรอกไม่หาย) */
const PUB_CACHE_KEY = 'wk_pub_cache_v1';
const PUB_CACHE_MAX_AGE = 7 * 864e5;
function pubCacheRead_() {
  try {
    const c = JSON.parse(localStorage.getItem(PUB_CACHE_KEY) || 'null');
    return c && c.s && Date.now() - Number(c.t) < PUB_CACHE_MAX_AGE ? c.s : '';
  } catch (e) { return ''; }
}
function pubCacheWrite_(str) { try { localStorage.setItem(PUB_CACHE_KEY, JSON.stringify({ t: Date.now(), s: str })); } catch (e) { /* เต็ม/ปิดไว้ก็ไม่เป็นไร */ } }
['pointerdown', 'keydown', 'focusin'].forEach(ev => document.addEventListener(ev, () => { S.touched = true; }, { capture: true, passive: true }));
function applyFresh_(d) {
  if (!S.touched || d.hidden || !S.days) { render(d); return; }
  S.days = d.days || {};
  if (/^\d{4}-\d{2}-\d{2}$/.test(String(d.today || ''))) S.today = d.today;
  if ($('cal')) renderCal();
  if ($('r_date') && $('r_date').value) checkDates();
}
async function loadPublic(fromBtn) {
  if (S.refreshing) return;
  S.refreshing = true;
  if (fromBtn) { fromBtn.classList.add('spin'); fromBtn.disabled = true; }
  let shown = '';
  if (!fromBtn && !S.loaded) {
    const c = pubCacheRead_();
    if (c) { try { render(JSON.parse(c)); shown = c; } catch (e) { shown = ''; } }
  }
  try {
    const d = await run('getPublicData');
    const str = JSON.stringify(d);
    if (d && !d.error) pubCacheWrite_(str);
    if (!shown) render(d);
    else if (str !== shown) applyFresh_(d);
    if (fromBtn) toast('อัปเดตคิวล่าสุดแล้ว');
  } catch (err) {
    if (fromBtn) toast('อัปเดตไม่สำเร็จ ลองใหม่อีกครั้ง');
    else if (shown) { /* มีข้อมูลจากเครื่องแสดงอยู่แล้ว ไม่ต้องทับด้วยหน้าข้อผิดพลาด */ }
    else $('root').innerHTML = '<div class="card" style="text-align:center"><p>โหลดคิวไม่สำเร็จ เช็กอินเทอร์เน็ตแล้วลองอีกครั้ง</p><button type="button" class="btn primary" data-refresh="1">🔄 ลองโหลดใหม่</button></div>';
  } finally {
    S.refreshing = false;
    if (fromBtn && fromBtn.isConnected) { fromBtn.classList.remove('spin'); fromBtn.disabled = false; }
  }
}

/* โหมดสว่าง/มืด (ลูกค้าเลือกเองต่อเครื่อง · ค่าเริ่มต้นตามระบบ) */
const APPEAR_TXT = { light: 'สว่าง', dark: 'มืด', auto: 'อัตโนมัติ' };
const darkMq_ = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
function getAppearance_() { try { const v = localStorage.getItem('wk_appearance'); return APPEAR_TXT[v] ? v : 'auto'; } catch (e) { return 'auto'; } }
function applyAppearance_(pref, animate) {
  const h = document.documentElement;
  if (animate) { h.classList.add('theme-anim'); setTimeout(() => h.classList.remove('theme-anim'), 360); }
  h.dataset.appearance = pref;
  h.dataset.theme = pref === 'dark' || (pref === 'auto' && darkMq_ && darkMq_.matches) ? 'dark' : 'light';
  document.querySelectorAll('.modebtn').forEach(b => { const t = 'โหมด' + APPEAR_TXT[pref] + ' — กดเพื่อสลับ'; b.title = t; b.setAttribute('aria-label', t); });
  const tc = $('themeColorMeta'); /* แถบเบราว์เซอร์มือถือ/PWA ใช้สีพื้นตามโหมดสว่าง/มืด (มีเฉพาะบน GitHub Pages) */
  if (tc) tc.setAttribute('content', h.dataset.theme === 'dark' ? '#0B0D11' : '#F6F7F9');
}
if (darkMq_) { const onSys = () => { if (getAppearance_() === 'auto') applyAppearance_('auto', true); }; darkMq_.addEventListener ? darkMq_.addEventListener('change', onSys) : darkMq_.addListener(onSys); }
document.addEventListener('click', e => {
  const mb = e.target.closest('button[data-act="appearance"]');
  if (!mb) return;
  const cur = getAppearance_(), next = cur === 'light' ? 'dark' : cur === 'dark' ? 'auto' : 'light';
  try { next === 'auto' ? localStorage.removeItem('wk_appearance') : localStorage.setItem('wk_appearance', next); } catch (err) {}
  applyAppearance_(next, true); toast('โหมด' + APPEAR_TXT[next]);
});

/* ลิงก์สลับหน้าบ้าน–หลังร้านบน GitHub Pages: เปิดที่หน้าต่างบนสุด (ไม่ซ้อน iframe) · ถ้าเบราว์เซอร์/sandbox ไม่ยอมให้เปลี่ยนหน้าบนสุด ให้เปิดแท็บใหม่แทน */
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-nav-top]');
  if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  e.preventDefault();
  const url = a.href;
  try { window.top.location.href = url; }
  catch (err) { if (!window.open(url, '_blank', 'noopener')) location.href = url; }
});

document.addEventListener('click', e => {
  const t = e.target.closest('[data-pick],[data-jump],[data-close],[data-refresh],[data-pm],[data-rclear]'); if (!t) return;
  e.preventDefault();
  if (t.dataset.pm === 'edit') { $('r_pmFields').hidden = false; $('r_pmHello').hidden = true; $('r_name').focus(); return; }
  if (t.dataset.pm === 'forget') { pmClear_(); ['r_house', 'r_name', 'r_phone', 'r_line'].forEach(id => { $(id).value = ''; }); pmShow_(null, ''); $('r_name').focus(); return; }
  if (t.dataset.rclear) { $('r_date').value = ''; $('r_end').value = ''; checkDates(); return; }
  if (t.dataset.pick && $('r_date')) {
    const iso = t.dataset.pick, a = S.rA, b = S.rB;
    if (a && !b && iso === a) { $('r_date').value = ''; $('r_end').value = ''; checkDates(); return; }
    if (a && !b && iso > a) { $('r_end').value = iso; checkDates(); }
    else { $('r_date').value = iso; $('r_end').value = ''; checkDates(); if (!wideLayout_()) { const c0 = $('reqCard'); if (c0) { c0.hidden = false; if ($('reqOpen')) $('reqOpen').hidden = true; } return; } }
  }
  if (t.dataset.refresh) { loadPublic(t); return; }
  if (t.dataset.close) {
    $('reqCard').hidden = true; if ($('reqOpen')) $('reqOpen').hidden = false; S.pick = ''; S.rA = S.rB = ''; if ($('cal')) renderCal();
    if ($('reqOpen')) $('reqOpen').scrollIntoView({ block: 'center' }); return;
  }
  const card = $('reqCard');
  if (card) {
    card.hidden = false;
    if ($('reqOpen')) $('reqOpen').hidden = true;
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    setTimeout(() => { const fe = $(t.dataset.pick || ($('r_date') && $('r_date').value) ? ($('r_pmFields') && $('r_pmFields').hidden ? 'r_detail' : 'r_name') : 'r_date'); if (fe) fe.focus({ preventScroll: true }); }, 400);
  }
});

applyAppearance_(getAppearance_(), false);
initFloatingClock_();
pageQpReady_.then(() => loadPublic(null));
</script>
