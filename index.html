<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตารางงาน DIT</title>
<meta name="description" content="ตารางงาน คิวจอง และติดต่อ">
<style>
  html, body { margin: 0; height: 100%; background: #f3f8fd; }
  #frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  #loader { position: fixed; inset: 0; z-index: 2; display: grid; place-items: center;
            background: #f3f8fd; transition: opacity .45s ease; font-family: "Prompt", system-ui, -apple-system, "Segoe UI", sans-serif; }
  #loader.hide { opacity: 0; pointer-events: none; }
  .spin { width: 42px; height: 42px; margin: 0 auto; border: 4px solid #cfe3f5; border-top-color: #2a72b3; border-radius: 50%; animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  .lt { margin-top: 14px; color: #687a8e; font-size: .95rem; text-align: center; }
  .err { max-width: 300px; text-align: center; color: #687a8e; font-size: .92rem; line-height: 1.6; }
  .err a { color: #2a72b3; }
</style>
</head>
<body>
<div id="loader"><div><div class="spin"></div><div class="lt">กำลังโหลด…</div></div></div>
<iframe id="frame"
        src="https://script.google.com/macros/s/AKfycbz4WaFl5I4NNDPDHoCTMf0rflVD0oe3burRytttlyIBCypmda1jz6oEpEveL63UF2gV/exec"
        allow="geolocation; clipboard-write; clipboard-read"
        title="ตารางงาน DIT"></iframe>
<script>
  (function () {
    var f = document.getElementById('frame'), l = document.getElementById('loader');
    function hide() { if (l) { l.classList.add('hide'); setTimeout(function () { if (l) l.remove(); }, 600); } }
    f.addEventListener('load', hide);
    // เผื่อ iframe โหลดช้า/บล็อก ให้ซ่อน loader อัตโนมัติใน 8 วิ
    setTimeout(hide, 8000);
  })();
</script>
</body>
</html>
