<!-- Styles.html — design tokens + พื้นฐานที่ใช้ร่วมกันทั้งหลังร้าน (Index) และหน้าบ้าน (Public)
     ดึงเข้าแต่ละหน้าด้วย scriptlet include('Styles') ใน head · ลำดับ: Appearance (data-theme) แยกจาก Accent (data-accent) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<script>
/* ตั้งโหมดสว่าง/มืดก่อนวาดหน้า เพื่อไม่ให้จอกระพริบ · ค่า: light | dark | auto (ค่าเริ่มต้น) */
(function () {
  var pref = 'auto';
  try { pref = localStorage.getItem('wk_appearance') || 'auto'; } catch (e) {}
  var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  var h = document.documentElement;
  h.setAttribute('data-theme', dark ? 'dark' : 'light');
  h.setAttribute('data-appearance', pref);
  if (!h.getAttribute('data-accent')) h.setAttribute('data-accent', 'sky');
})();
</script>
<style>
/* ================= Tokens: Light · Crisp Daylight ================= */
:root {
  --canvas: #F6F7F9;
  --surface: #FFFFFF;
  --surface-2: #F9FAFB;
  --surface-3: #F2F4F7;
  --border: #E4E7EC;
  --border-strong: #D0D5DD;
  --input-bg: #FFFFFF;
  --input-border: #D0D5DD;
  --text: #111827;
  --text-2: #667085;
  --text-3: #98A2B3;
  --shadow-sm: 0 1px 2px rgba(16, 24, 40, .05);
  --shadow-md: 0 8px 24px -4px rgba(16, 24, 40, .10), 0 2px 6px rgba(16, 24, 40, .05);
  --scrim: rgba(16, 24, 40, .40);
  --glass: rgba(255, 255, 255, .72);

  --mint: #067647;  --mint-soft: #ECFDF3;
  --amber: #B54708; --amber-soft: #FFFAEB;
  --rose: #C01048;  --rose-soft: #FFF1F3;
  --rest: #5925DC;  --rest-soft: #F4F3FF;

  --accent-l: #2A6FB0; --accent-d: #5AA6F0;
  --accent2-l: var(--accent-l); --accent2-d: var(--accent-d);

  --font-sans: "Inter", "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-8: 32px;
  --r-sm: 6px; --r-md: 8px; --r-lg: 10px; --r-xl: 12px;
  --dur: 200ms; --ease: cubic-bezier(.2, 0, 0, 1);

  color-scheme: light;
}

/* ================= Tokens: Dark · Studio Obsidian ================= */
html[data-theme="dark"] {
  --canvas: #0B0D11;
  --surface: #13161C;
  --surface-2: #181C24;
  --surface-3: #1E232D;
  --border: #232834;
  --border-strong: #2A303E;
  --input-bg: #0F1117;
  --input-border: #2A303E;
  --text: #F3F4F6;
  --text-2: #9CA3AF;
  --text-3: #6B7280;
  --shadow-sm: none;
  --shadow-md: 0 16px 40px -8px rgba(0, 0, 0, .60), 0 2px 8px rgba(0, 0, 0, .40);
  --scrim: rgba(0, 0, 0, .60);
  --glass: rgba(19, 22, 28, .70);

  --mint: #4ADE80;  --mint-soft: #0F2A1D;
  --amber: #FBBF24; --amber-soft: #2B2110;
  --rose: #FB7185;  --rose-soft: #2D1219;
  --rest: #A5A0F5;  --rest-soft: #1E1B33;

  color-scheme: dark;
}

/* ================= Accent / Festival (ผ่าน WCAG AA ทั้ง 2 โหมด) ================= */
html[data-accent="midnight"]    { --accent-l: #4F46E5; --accent-d: #8E95FA; }
html[data-accent="sunset"]      { --accent-l: #C2410C; --accent-d: #F28C52; }
html[data-accent="xmas"]        { --accent-l: #15803D; --accent-d: #4ADE80; --accent2-l: #B91C1C; --accent2-d: #F87171; }
html[data-accent="songkran"]    { --accent-l: #0E7490; --accent-d: #2CC5DB; }
html[data-accent="loykrathong"] { --accent-l: #A16207; --accent-d: #E3B341; }
html[data-accent="national"]    { --accent-l: #2D3192; --accent-d: #8F96EC; --accent2-l: #C8102E; --accent2-d: #F2687A; }

:root {
  --accent: var(--accent-l);
  --accent-2: var(--accent2-l);
  --accent-ink: #FFFFFF;
}
html[data-theme="dark"] {
  --accent: var(--accent-d);
  --accent-2: var(--accent2-d);
  --accent-ink: #0B0D11;
}
/* ค่าที่ derive จาก accent — ประกาศที่ html (ไม่ใช่ :root) เพื่อให้คำนวณใหม่ทุกครั้งที่ accent เปลี่ยน */
html, html[data-theme] {
  --accent-hover: color-mix(in srgb, var(--accent) 88%, var(--text));
  --accent-soft: color-mix(in srgb, var(--accent) 12%, var(--surface));
  --accent-softer: color-mix(in srgb, var(--accent) 6%, var(--surface));
  --accent-line: color-mix(in srgb, var(--accent) 40%, var(--border));
  --ring: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent);

  /* ---------- alias ชื่อตัวแปรเดิม (JS/inline style ในหน้ายังอ้างอยู่ ห้ามลบ) ---------- */
  --bg: var(--canvas);
  --ink: var(--text);
  --muted: var(--text-2);
  --line: var(--border);
  --brand: var(--accent);
  --brand-ink: var(--accent-ink);
  --sky: var(--accent-line);
  --sky-soft: var(--accent-soft);
  --sky-softer: var(--surface-2);
  --tint-a: var(--accent-soft);
  --tint-b: var(--surface);
  --login-top: var(--canvas);
  --skel-a: var(--surface-3);
  --skel-b: var(--surface-2);
  --chip-past: var(--surface-3);
  --day-past: var(--surface-2);
  --day-past-ink: var(--text-3);
  --switch-off: var(--border-strong);
  --shadow: var(--shadow-sm);
  --font: var(--font-sans);
  --display: var(--font-sans);
  --r: var(--r-xl);
}

/* ================= Base ================= */
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--canvas); color: var(--text);
  font: 400 15px/1.55 var(--font-sans);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
button, input, textarea, select { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-sans); font-weight: 600; margin: 0; line-height: 1.3; letter-spacing: -0.01em; text-wrap: balance; }
a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
.num, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
[hidden] { display: none !important; }
::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); color: var(--text); }
input, textarea { caret-color: var(--accent); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }
* { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

/* สลับโหมดนุ่มๆ — เปิดเฉพาะตอนกดสลับ (class ใส่ชั่วคราว) เพื่อไม่ให้ทุก hover ช้า */
html.theme-anim, html.theme-anim *, html.theme-anim *::before, html.theme-anim *::after {
  transition: background-color var(--dur) ease, border-color var(--dur) ease, color var(--dur) ease, fill var(--dur) ease, box-shadow var(--dur) ease !important;
}
@media (prefers-reduced-motion: reduce) {
  html.theme-anim, html.theme-anim * { transition: none !important; }
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
}

/* ================= ปุ่มสลับโหมด (ใช้ทั้ง 2 หน้า) ================= */
.modebtn { position: relative; }
.modebtn svg { display: none; }
html[data-appearance="light"] .modebtn .ic-sun,
html[data-appearance="dark"] .modebtn .ic-moon,
html[data-appearance="auto"] .modebtn .ic-auto { display: block; }

/* ================= Floating clock · glass pill ================= */
.float-clock {
  position: fixed; right: 16px; bottom: calc(var(--nav-h, 0px) + 16px + env(safe-area-inset-bottom)); z-index: 15;
  display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px;
  border-radius: 999px; border: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
  background: var(--glass);
  -webkit-backdrop-filter: blur(14px) saturate(1.5); backdrop-filter: blur(14px) saturate(1.5);
  box-shadow: var(--shadow-md); color: var(--text); cursor: pointer; user-select: none;
  transition: transform 160ms var(--ease), opacity 160ms var(--ease), visibility 160ms;
}
.float-clock:hover { border-color: var(--border-strong); }

.float-clock .fc-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--mint); flex: 0 0 auto; }
.float-clock .fc-time { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 500; font-size: 13px; line-height: 1; }
.float-clock .fc-date { font-size: 12px; color: var(--text-2); padding-left: 8px; border-left: 1px solid var(--border); line-height: 1; white-space: nowrap; }
.float-clock .fc-ic { display: none; width: 16px; height: 16px; color: var(--text-2); }
.float-clock.min { width: 32px; padding: 0; justify-content: center; gap: 0; }
.float-clock.min .fc-dot, .float-clock.min .fc-time, .float-clock.min .fc-date { display: none; }
.float-clock.min .fc-ic { display: block; }
body.noscroll .float-clock, body.has-savebar .float-clock, body.drawer-open .float-clock, .float-clock.scrolling { opacity: 0; visibility: hidden; transform: translateY(8px); pointer-events: none; }
@media (max-width: 420px) { .float-clock .fc-date { display: none; } }
@media print { .float-clock { display: none !important; } }
</style>
<style>
/* Layout: การ์ดโปรไฟล์ → บริการ → ปฏิทินคิว → ฟอร์มขอจองคิว (คอลัมน์เดียว อ่านง่ายบนมือถือ) */

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-sm); padding: var(--sp-5); }

.profile { position: relative; text-align: center; padding: var(--sp-8) var(--sp-5) var(--sp-6); }

.skel { height: 260px; border-radius: 16px; border: 1px solid var(--border); background: linear-gradient(90deg, var(--surface-2), var(--surface-3), var(--surface-2)); background-size: 200% 100%; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--surface); padding: 10px 16px; border-radius: var(--r-lg); z-index: 40; font-size: 14px; font-weight: 500; box-shadow: var(--shadow-md); max-width: calc(100vw - 32px); }
.pub-notice { background: var(--accent-soft); border: 1px solid var(--accent-line); color: var(--text); border-radius: var(--r-xl); padding: 12px 16px; font-size: 14px; font-weight: 500; text-align: center; white-space: pre-wrap; }
/* ---------- แถบประกาศวิ่ง แบบที่ 2 (News Badge Ticker) ---------- */
.pub-ticker {
  display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 6px;
  border-radius: var(--r-xl); background: var(--surface); border: 1px solid var(--border);
  box-shadow: var(--shadow-sm); overflow: hidden;
}
.pub-ticker .pt-badge {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px;
  background: var(--brand); color: var(--brand-ink);
  font-family: var(--display); font-size: .78rem; font-weight: 600;
  padding: 4px 10px; border-radius: var(--r-md); white-space: nowrap;
}
.pub-ticker .pt-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .9; animation: ptPulse 1.6s ease-in-out infinite; }
@keyframes ptPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.8); } }
.pub-ticker .pt-track {
  flex: 1; min-width: 0; overflow: hidden; position: relative;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 14px, #000 calc(100% - 14px), transparent);
  mask-image: linear-gradient(90deg, transparent, #000 14px, #000 calc(100% - 14px), transparent);
}
.pub-ticker .pt-move {
  display: inline-flex; align-items: center; width: max-content;
  animation: pubMarquee var(--mq-dur, 18s) linear infinite;
  will-change: transform;
}
.pub-ticker:hover .pt-move, .pub-ticker:active .pt-move { animation-play-state: paused; }
.pub-ticker .pt-seg {
  display: inline-flex; align-items: center; white-space: nowrap;
  padding-right: 48px; font-size: 14px; font-weight: 500; color: var(--text);
}
@keyframes pubMarquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) {
  .pub-ticker .pt-move { animation: none; }
  .pub-ticker .pt-seg:last-child { display: none; }
  .pub-ticker .pt-seg { white-space: normal; padding-right: 0; }
}

  $('mTitle').textContent = TH_M[m] + ' ' + (y + 543);
  $('cal').innerHTML = h;
  $('sum').innerHTML = 'เดือนนี้ว่างอีก <b class="num">' + free + '</b> วัน' + (S.canReq ? '<div class="hint">แตะวันที่ว่างหรือคิวหลวม เพื่อขอจองคิว</div>' : '');
  $('prev').disabled = key <= S.minKey;
  $('next').disabled = key >= S.maxKey;
}

function requestForm(p) {
  return '<section class="card" id="reqCard" hidden><div style="display:flex;align-items:center;gap:8px"><h2 style="font-size:1.15rem;flex:1">ขอจองคิว</h2><button type="button" class="iconbtn" data-close="1" aria-label="ปิดฟอร์ม">✕</button></div>' +
    '<div class="hint" style="margin-bottom:14px">ส่งรายละเอียดมาก่อน ' + esc(p.displayName || '') + ' จะติดต่อกลับเพื่อยืนยันคิว</div>' +
    '<form id="reqForm" class="grid2" novalidate>' +
    '<label class="field" for="r_date">วันที่ต้องการ *<input id="r_date" type="date" required></label>' +
    '<label class="field" for="r_end">ถึงวันที่ <span class="hint">(ถ้าหลายวัน)</span><input id="r_end" type="date"></label>' +
    '<div class="full" id="r_state"></div>' +
    '<div class="full field" role="radiogroup" aria-label="แบบการจองคิว"><span>แบบการจองคิว *</span><div class="qpick">' +
    '<label><input type="radio" name="r_queue" value="lock" checked><b>🔒 ล็อกคิว</b><span class="hint">ยืนยันงานแน่นอน ขอให้กันวันไว้ให้</span></label>' +
    '<label class="loose"><input type="radio" name="r_queue" value="loose"><b>คิวหลวม</b><span class="hint">จองไว้ก่อน ยังไม่ยืนยัน ถ้ามีงานอื่นอาจถูกแทน</span></label></div></div>' +
    '<label class="field" for="r_time">Call time<input id="r_time" type="time"></label>' +
    '<label class="field" for="r_house">House / Production<input id="r_house" autocomplete="organization"></label>' +
    '<label class="field" for="r_name">ชื่อผู้ติดต่อ *<input id="r_name" autocomplete="name" required></label>' +
    '<label class="field" for="r_phone">เบอร์โทร<input id="r_phone" type="tel" inputmode="tel" autocomplete="tel"></label>' +
    '<label class="field full" for="r_line">LINE ID <span class="hint">(ใส่เบอร์หรือ LINE อย่างน้อย 1 ช่อง)</span><input id="r_line"></label>' +
    '<label class="field full" for="r_loc">สถานที่ถ่าย<input id="r_loc" placeholder="ชื่อสถานที่ หรือวางลิงก์ Google Maps"></label>' +
    '<label class="field full" for="r_detail">รายละเอียดงาน<textarea id="r_detail" placeholder="เช่น ประเภทงาน ตำแหน่งที่ต้องการ จำนวนวัน งบประมาณ"></textarea></label>' +
    '<div class="hp" aria-hidden="true"><label>เว็บไซต์<input id="r_web" tabindex="-1" autocomplete="off"></label></div>' +
    '<div class="full" id="r_msg"></div>' +
    '<button class="btn primary block full" type="submit" id="r_send">ส่งคำขอจองคิว</button></form></section>';
}

function render(d) {
  const root = $('root');
  if (!d) { root.innerHTML = '<div class="card" style="text-align:center"><p>โหลดข้อมูลไม่สำเร็จ กรุณาลองอีกครั้ง</p><button type="button" class="btn primary" data-refresh="1">🔄 ลองโหลดใหม่</button></div>'; return; }
  if (d.hidden) { root.innerHTML = '<div class="card" style="position:relative;text-align:center"><button type="button" class="iconbtn refresh pub-refresh" id="pubRefresh" data-refresh="1" aria-label="รีเฟรช" title="รีเฟรชข้อมูล">' + ICON.refresh + '</button><h1 style="font-size:1.2rem">หน้านี้ปิดอยู่ชั่วคราว</h1></div>'; return; }
  const p = d.profile || {};
  document.documentElement.dataset.accent = (['midnight','sunset','xmas','songkran','loykrathong','national'].indexOf(p.theme) >= 0 ? p.theme : 'sky');
  document.documentElement.dataset.pubeffect = (['fireworks','snow'].indexOf(p.pubEffect) >= 0 ? p.pubEffect : '');
  if (p.pubCustomBrand && /^#[0-9a-fA-F]{3,6}$/.test(String(p.pubCustomBrand).trim())) {
    const cb = String(p.pubCustomBrand).trim();
    document.documentElement.style.setProperty('--accent-l', cb);
    document.documentElement.style.setProperty('--accent-d', 'color-mix(in srgb, ' + cb + ' 70%, #ffffff)');
  } else {
    document.documentElement.style.removeProperty('--accent-l');
    document.documentElement.style.removeProperty('--accent-d');
  }
  const cStyle = $('pubCustomStyle');
  if (cStyle) cStyle.textContent = String(p.pubCustomCss || '').replace(/<\/?style[^>]*>/gi, '');
  LBL.free = String(p.pubLblFree || '').trim() || 'ว่าง';
  LBL.loose = String(p.pubLblLoose || '').trim() || 'คิวหลวม';
  LBL.lock = String(p.pubLblLock || '').trim() || 'ไม่ว่าง';
  LBL.off = String(p.pubLblOff || '').trim() || 'วันพัก';
  const reqBtnTxt = String(p.pubReqBtnText || '').trim() || '📅 ขอจองคิว';
  document.title = (p.displayName || 'โปรไฟล์') + ' · เช็คคิว';
  const phone = (p.phone || '').replace(/[^0-9+]/g, '');
  const lineId = (p.line || '').replace(/^@/, '');
  S.canReq = p.acceptRequests !== 'no';
  const extraLinks = String(p.pubLinks || '').split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const parts = l.split('|').map(x => x.trim());
    const url = parts.length >= 2 ? parts[1] : (parts[0] || '');
    const lbl = parts.length >= 2 && parts[0] ? parts[0] : 'ลิงก์';
    if (!/^https:\/\/[^\s"'<>]+$/i.test(url)) return '';
    return '<a class="btn" href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(lbl) + ' ↗</a>';
  }).filter(Boolean).join('');
  const contacts = [
    phone ? '<a class="btn primary" href="tel:' + esc(phone) + '">' + ICON.phone + 'โทร</a>' : '',
    lineId ? '<a class="btn" href="https://line.me/ti/p/~' + encodeURIComponent(lineId) + '" target="_blank" rel="noopener">' + ICON.chat + 'LINE</a>' : '',
    p.email ? '<a class="btn" href="mailto:' + esc(p.email) + '">' + ICON.mail + 'อีเมล</a>' : '',
    extraLinks,
    S.canReq ? '<button type="button" class="btn" data-jump="1">' + esc(reqBtnTxt) + '</button>' : ''
  ].join('');
  const copyLine = [p.phone ? 'โทร ' + esc(p.phone) : '', p.line ? 'LINE ' + esc(p.line) : '', p.email ? esc(p.email) : ''].filter(Boolean).join(' · ');
  const services = String(p.services || '').split('\n').map(s => s.trim()).filter(Boolean);
  const noticeRaw = String(p.pubNotice || '').trim();
  const noticeLine = noticeRaw.replace(/\s*\n+\s*/g, '   •   ');
  const mqDur = Math.min(60, Math.max(5, Number(p.pubNoticeSpeed) || 18));
  const mqBadge = String(p.pubNoticeBadge || '').trim() || 'ประกาศ';
  const noticeHtml = !noticeRaw ? '' : (p.pubNoticeMarquee !== 'no'
    ? '<div class="pub-ticker" style="--mq-dur:' + mqDur + 's" role="region" aria-label="ประกาศ">' +
        '<span class="pt-badge"><span class="pt-dot" aria-hidden="true"></span>' + esc(mqBadge) + '</span>' +
        '<div class="pt-track"><div class="pt-move">' +
          '<span class="pt-seg">' + esc(noticeLine) + '</span>' +
          '<span class="pt-seg" aria-hidden="true">' + esc(noticeLine) + '</span>' +
        '</div></div></div>'
    : '<div class="pub-notice">' + esc(noticeRaw) + '</div>');
  let h = noticeHtml +
    '<section class="card profile">' + MODE_BTN +
    '<button type="button" class="iconbtn refresh pub-refresh" id="pubRefresh" data-refresh="1" aria-label="รีเฟรช" title="รีเฟรชข้อมูล">' + ICON.refresh + '</button>' +
    '<div class="photo" style="' + (p.photo ? 'background-image:url(&quot;' + p.photo + '&quot;)' : '') + '">' + (p.photo ? '' : esc((p.displayName || '?').charAt(0))) + '</div>' +
    '<h1>' + esc(p.displayName) + '</h1>' + (p.headline ? '<div class="headline">' + esc(p.headline) + '</div>' : '') +
    (p.bio ? '<p class="bio">' + esc(p.bio) + '</p>' : '') +
    (contacts ? '<div class="contacts">' + contacts + '</div>' : '') +
    (copyLine ? '<div class="copy">' + copyLine + '</div>' : '') + '</section>';
  if (services.length) h += '<section class="card"><h2 style="font-size:1.1rem">บริการที่รับ</h2><div class="services">' + services.map(s => '<span>' + esc(s) + '</span>').join('') + '</div></section>';
  if (p.showCalendar !== 'no') {
    h += '<section class="card"><h2 style="font-size:1.1rem">เช็คคิวงาน</h2><div class="hint">อัปเดตตามตารางงานจริง</div>' +
      '<div class="monthbar" style="margin-top:12px"><button class="iconbtn" id="prev" aria-label="เดือนก่อน">' + ICON.left + '</button><h2 id="mTitle"></h2><button class="iconbtn" id="next" aria-label="เดือนถัดไป">' + ICON.right + '</button></div>' +
      '<div class="cal" id="cal"></div><div class="sum" id="sum"></div>' +
      '<div class="legend"><span><i style="background:var(--mint-soft);border:1px solid var(--mint)"></i>' + esc(LBL.free) + '</span><span><i style="background:var(--amber-soft);border:1px solid var(--amber)"></i>' + esc(LBL.loose) + '</span>' +
      '<span><i style="background:var(--rose-soft);border:1px solid var(--rose)"></i>' + esc(LBL.lock) + '</span><span><i style="background:var(--rest-soft);border:1px solid var(--rest)"></i>' + esc(LBL.off) + '</span></div></section>';
  }
  if (S.canReq) h += '<button type="button" class="btn primary block" id="reqOpen" data-jump="1" style="min-height:54px;font-size:1.05rem">' + esc(reqBtnTxt) + '</button>' + requestForm(p);
  h += '<div class="foot">' + (APP_URL ? '<a href="' + esc(APP_URL) + '?page=admin">สำหรับเจ้าของ</a>' : '') + '</div>';
  root.innerHTML = h;

  const fallbackToday = (() => { const n = new Date(); return n.getFullYear() + '-' + pad(n.getMonth() + 1) + '-' + pad(n.getDate()); })();
  S.days = d.days || {}; S.today = /^\d{4}-\d{2}-\d{2}$/.test(String(d.today || '')) ? d.today : fallbackToday; S.pick = '';
  const [ty, tm] = S.today.split('-').map(Number);
  S.minKey = ty * 12 + tm - 1; S.maxKey = S.minKey + 12;
  const curKey = S.y * 12 + S.m;
  if (!S.loaded || curKey < S.minKey || curKey > S.maxKey) { S.y = ty; S.m = tm - 1; }
  S.loaded = true;
  if (p.showCalendar !== 'no') {
    $('prev').onclick = () => { if (--S.m < 0) { S.m = 11; S.y--; } renderCal(); };
    $('next').onclick = () => { if (++S.m > 11) { S.m = 0; S.y++; } renderCal(); };
    renderCal();
  }
  if (S.canReq) wireForm();
}

function checkDates() {
  const s = $('r_date').value, e = $('r_end').value || s;
  if (!s) { $('r_state').innerHTML = ''; return; }
  if (s < S.today) { $('r_state').innerHTML = '<div class="msg bad">กรุณาเลือกวันที่ตั้งแต่วันนี้เป็นต้นไป</div>'; return; }
  if (e < s) { $('r_state').innerHTML = '<div class="msg bad">“ถึงวันที่” ต้องไม่ก่อนวันเริ่ม</div>'; return; }
  const bad = [], looses = [];
  for (let d = s, n = 0; d <= e && n < 62; n++) {
    const st = stOf(d);
    if (st === 'lock' || st === 'off') bad.push(thFull(d) + ' ' + LBL[st]);
    else if (st === 'loose') looses.push(thFull(d));
    const p = d.split('-').map(Number); d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + 1)).toISOString().slice(0, 10);
  }
  $('r_state').innerHTML = bad.length ? '<div class="msg warn">' + esc(bad.slice(0, 3).join(', ')) + (bad.length > 3 ? ' …' : '') + ' — ส่งคำขอได้ แต่อาจไม่ว่าง</div>'
    : looses.length ? '<div class="msg warn">' + (looses.length === 1 && s === e ? 'วันนี้มีคิวหลวมอยู่' : 'ช่วงที่เลือกมีคิวหลวม (' + esc(looses.slice(0, 3).join(', ')) + (looses.length > 3 ? ' …' : '') + ')') + ' ส่งคำขอเป็นคิวสำรองได้</div>'
    : '<div class="msg ok">วันที่เลือกว่าง ✓</div>';
  S.pick = s; if ($('cal')) renderCal();
}

function wireForm() {
  $('r_date').min = S.today; $('r_end').min = S.today;
  ['r_date', 'r_end'].forEach(id => { $(id).addEventListener('input', checkDates); $(id).addEventListener('change', checkDates); });
  $('reqForm').addEventListener('submit', async e => {
    e.preventDefault();
    const v = id => $(id).value.trim();
    const bad = (m, id) => { $('r_msg').innerHTML = '<div class="msg bad">' + m + '</div>'; if (id) $(id).focus(); };
    if (!v('r_date')) return bad('กรุณาเลือกวันที่ต้องการ', 'r_date');
    if (v('r_end') && v('r_end') < v('r_date')) return bad('“ถึงวันที่” ต้องไม่ก่อนวันเริ่ม', 'r_end');
    if (!v('r_name')) return bad('กรุณาใส่ชื่อผู้ติดต่อ', 'r_name');
    if (!v('r_phone') && !v('r_line')) return bad('กรุณาใส่เบอร์โทรหรือ LINE อย่างน้อย 1 ช่อง', 'r_phone');
    const loc = v('r_loc'), isUrl = /^https:\/\//i.test(loc);
    $('r_send').disabled = true; $('r_send').textContent = 'กำลังส่ง…'; $('r_msg').innerHTML = '';
    const reqDate = v('r_date'), reqEnd = v('r_end'), reqQ = (document.querySelector('input[name="r_queue"]:checked') || {}).value || 'lock';
    try {
      await run('submitRequest', { date: reqDate, endDate: reqEnd, time: v('r_time'), house: v('r_house'), name: v('r_name'), phone: v('r_phone'), line: v('r_line'), location: isUrl ? '' : loc, mapUrl: isUrl ? loc : '', detail: v('r_detail'), website: v('r_web'), queue: reqQ });
      $('reqCard').innerHTML = '<div class="done"><div class="ic">✓</div><h2 style="font-size:1.2rem">ส่งคำขอแล้ว</h2><p class="hint">ขอคิววันที่ ' + esc(thFull(reqDate)) + (reqEnd ? ' – ' + esc(thFull(reqEnd)) : '') + '<br>แบบ: ' + (reqQ === 'loose' ? 'คิวหลวม' : '🔒 ล็อกคิว') + '<br>จะติดต่อกลับเพื่อยืนยันคิวโดยเร็ว</p><button type="button" class="btn" data-refresh="1" style="margin-top:8px">รีเฟรชหน้านี้</button></div>';
    } catch (err) { $('r_send').disabled = false; $('r_send').textContent = 'ส่งคำขอจองคิว'; bad(esc(err)); }
  });
}

async function loadPublic(fromBtn) {
  if (S.refreshing) return;
  S.refreshing = true;
  if (fromBtn) { fromBtn.classList.add('spin'); fromBtn.disabled = true; }
  try {
    const d = await run('getPublicData');
    render(d);
    if (fromBtn) toast('อัปเดตข้อมูลแล้ว');
  } catch (err) {
    if (fromBtn) toast('อัปเดตไม่สำเร็จ ลองใหม่อีกครั้ง');
    else $('root').innerHTML = '<div class="card" style="text-align:center"><p>โหลดข้อมูลไม่สำเร็จ กรุณาลองอีกครั้ง</p><button type="button" class="btn primary" data-refresh="1">🔄 ลองโหลดใหม่</button></div>';
  } finally {
    S.refreshing = false;
    if (fromBtn && fromBtn.isConnected) { fromBtn.classList.remove('spin'); fromBtn.disabled = false; }
  }
}

/* โหมดสว่าง/มืด (ลูกค้าเลือกเองต่อเครื่อง · ค่าเริ่มต้นตามระบบ) */
const APPEAR_TXT = { light: 'สว่าง', dark: 'มืด', auto: 'อัตโนมัติ' };
const darkMq_ = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
function getAppearance_() { try { const v = localStorage.getItem('wk_appearance'); return APPEAR_TXT[v] ? v : 'auto'; } catch (e) { return 'auto'; } }
function applyAppearance_(pref, animate) {
  const h = document.documentElement;
  if (animate) { h.classList.add('theme-anim'); setTimeout(() => h.classList.remove('theme-anim'), 260); }
  h.dataset.appearance = pref;
  h.dataset.theme = pref === 'dark' || (pref === 'auto' && darkMq_ && darkMq_.matches) ? 'dark' : 'light';
  document.querySelectorAll('.modebtn').forEach(b => { const t = 'โหมด' + APPEAR_TXT[pref] + ' — กดเพื่อสลับ'; b.title = t; b.setAttribute('aria-label', t); });
  const tc = $('themeColorMeta'); /* แถบเบราว์เซอร์มือถือ/PWA ใช้สีพื้นตามโหมดสว่าง/มืด (มีเฉพาะบน GitHub Pages) */
  if (tc) tc.setAttribute('content', h.dataset.theme === 'dark' ? '#0B0D11' : '#F6F7F9');
}
if (darkMq_) { const onSys = () => { if (getAppearance_() === 'auto') applyAppearance_('auto', true); }; darkMq_.addEventListener ? darkMq_.addEventListener('change', onSys) : darkMq_.addListener(onSys); }
document.addEventListener('click', e => {
  const mb = e.target.closest('button[data-act="appearance"]');
  if (!mb) return;
  const cur = getAppearance_(), next = cur === 'light' ? 'dark' : cur === 'dark' ? 'auto' : 'light';
  try { next === 'auto' ? localStorage.removeItem('wk_appearance') : localStorage.setItem('wk_appearance', next); } catch (err) {}
  applyAppearance_(next, true); toast('โหมด' + APPEAR_TXT[next]);
});

document.addEventListener('click', e => {
  const t = e.target.closest('[data-pick],[data-jump],[data-close],[data-refresh]'); if (!t) return;
  e.preventDefault();
  if (t.dataset.refresh) { loadPublic(t); return; }
  if (t.dataset.close) {
    $('reqCard').hidden = true; if ($('reqOpen')) $('reqOpen').hidden = false; S.pick = ''; if ($('cal')) renderCal();
    if ($('reqOpen')) $('reqOpen').scrollIntoView({ block: 'center' }); return;
  }
  if (t.dataset.pick && $('r_date')) { $('r_date').value = t.dataset.pick; $('r_end').value = ''; checkDates(); }
  const card = $('reqCard');
  if (card) {
    card.hidden = false;
    if ($('reqOpen')) $('reqOpen').hidden = true;
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    setTimeout(() => { const fe = $(t.dataset.pick ? 'r_name' : 'r_date'); if (fe) fe.focus({ preventScroll: true }); }, 400);
  }
});

applyAppearance_(getAppearance_(), false);
initFloatingClock_();
loadPublic(null);
</script>
</body>
</html>
