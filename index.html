const TH_MS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_D = ['อา','จ','อ','พ','พฤ','ศ','ส'];
const LBL = { free: 'ว่าง', loose: 'คิวหลวม', lock: 'ไม่ว่าง', off: 'วันพัก' };
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const thFull = iso => { const p = iso.split('-').map(Number); return p[2] + ' ' + TH_M[p[1] - 1] + ' ' + (p[0] + 543); };
const $ = id => document.getElementById(id);
const ICON = {
  phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.6-.8L3 20.5l1.4-4.6A8 8 0 0 1 3 11.5 8.6 8.6 0 0 1 12 3a8.6 8.6 0 0 1 9 8.5z"/></svg>',
  mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>'
};

function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; el.setAttribute('role', 'status');
  $('toastRoot').replaceChildren(el); setTimeout(() => el.remove(), 2600);
}

function initFloatingClock_() {
  const el = $('floatClock'), tEl = $('fcTime'), dEl = $('fcDate');
  if (!el || !tEl || !dEl) return;
  const setMin = m => {
    el.classList.toggle('min', !!m);
    try { m ? localStorage.setItem('wk_pub_clock_min', '1') : localStorage.removeItem('wk_pub_clock_min'); } catch (e) {}
  };
  try { if (localStorage.getItem('wk_pub_clock_min') === '1') el.classList.add('min'); } catch (e) {}
  el.addEventListener('click', () => setMin(!el.classList.contains('min')));
  const tick = () => {
    const n = new Date();
    tEl.textContent = pad(n.getHours()) + ':' + pad(n.getMinutes()) + ':' + pad(n.getSeconds());
    dEl.textContent = TH_D[n.getDay()] + '. ' + n.getDate() + ' ' + TH_MS[n.getMonth()];
  };
  tick();
  setInterval(tick, 1000);
}

function run(fn, data) {
  if (fn === 'getPublicData') {
    return fetch(EXEC_URL + '?api=public', { cache: 'no-store' }).then(r => r.json());
  }
  if (fn === 'submitRequest') {
    const params = new URLSearchParams();
    Object.keys(data || {}).forEach(k => { if (data[k] != null && data[k] !== '') params.set(k, data[k]); });
    return fetch(EXEC_URL + '?api=submit&' + params.toString(), { cache: 'no-store' })
      .then(r => r.json())
      .then(res => { if (!res || res.ok !== true) throw new Error((res && res.error) || 'ส่งคำขอไม่สำเร็จ'); return res; });
  }
  return Promise.reject(new Error('unknown fn: ' + fn));
}

const S = { days: {}, today: '', y: 0, m: 0, minKey: 0, maxKey: 0, pick: '', canReq: false, loaded: false, refreshing: false };
const stOf = iso => S.days[iso] || 'free';

function renderCal() {
  const { y, m } = S;
  const first = new Date(Date.UTC(y, m, 1)).getUTCDay();
  const dim = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  let h = TH_D.map(d => '<div class="dow">' + d + '</div>').join('');
  for (let i = 0; i < first; i++) h += '<div class="day blank"></div>';
  let free = 0;
  for (let d = 1; d <= dim; d++) {
    const iso = y + '-' + pad(m + 1) + '-' + pad(d);
    const past = iso < S.today, st = stOf(iso);
    if (!past && st === 'free') free++;
    const cls = 'day ' + (past ? 'past' : st) + (iso === S.today ? ' today' : '') + (iso === S.pick ? ' pick' : '');
    const label = d + ' ' + TH_M[m] + (past ? '' : ' ' + LBL[st]);
    const canPick = !past && S.canReq && (st === 'free' || st === 'loose');
    h += (canPick ? '<button type="button" class="' + cls + '" data-pick="' + iso + '" aria-label="' + label + ' แตะเพื่อขอจองคิว">' : '<div class="' + cls + '" aria-label="' + label + '">') +
      '<span class="num">' + d + '</span>' + (past ? '' : '<small>' + LBL[st] + '</small>') + (canPick ? '</button>' : '</div>');
  }
  const key = y * 12 + m;
  $('mTitle').textContent = TH_M[m] + ' ' + (y + 543);
  $('cal').innerHTML = h;
  $('sum').innerHTML = 'เดือนนี้ว่างอีก <b class="num">' + free + '</b> วัน' + (S.canReq ? '<div class="hint">แตะวันที่ว่างหรือคิวหลวม เพื่อขอจองคิว</div>' : '');
  $('prev').disabled = key <= S.minKey;
  $('next').disabled = key >= S.maxKey;
}

function render(d) {
  const root = $('root');
  if (!d) { root.innerHTML = '<div class="card" style="text-align:center"><p>โหลดข้อมูลไม่สำเร็จ กรุณาลองอีกครั้ง</p><button type="button" class="btn primary" data-refresh="1">🔄 ลองโหลดใหม่</button></div>'; return; }
  if (d.hidden) { root.innerHTML = '<div class="card" style="position:relative;text-align:center"><button type="button" class="iconbtn refresh pub-refresh" id="pubRefresh" data-refresh="1" aria-label="รีเฟรช" title="รีเฟรชข้อมูล">' + ICON.refresh + '</button><h1 style="font-size:1.2rem">หน้านี้ปิดอยู่ชั่วคราว</h1></div>'; return; }
  const p = d.profile || {};
  document.documentElement.dataset.theme = (['midnight','sunset','xmas','songkran','loykrathong','national'].indexOf(p.theme) >= 0 ? p.theme : 'sky');
  if (p.pubCustomBrand && /^#[0-9a-fA-F]{3,6}$/.test(String(p.pubCustomBrand).trim())) {
    document.documentElement.style.setProperty('--brand', String(p.pubCustomBrand).trim());
  } else {
    document.documentElement.style.removeProperty('--brand');
  }
  const tc = $('themeColorMeta');
  if (tc) { requestAnimationFrame(() => { tc.setAttribute('content', getComputedStyle(document.documentElement).getPropertyValue('--brand').trim() || '#2a72b3'); }); }
  const cStyle = $('pubCustomStyle');
  if (cStyle) cStyle.textContent = String(p.pubCustomCss || '').replace(/<\/?style[^>]*>/gi, '');
  LBL.free = String(p.pubLblFree || '').trim() || 'ว่าง';
  LBL.loose = String(p.pubLblLoose || '').trim() || 'คิวหลวม';
  LBL.lock = String(p.pubLblLock || '').trim() || 'ไม่ว่าง';
  LBL.off = String(p.pubLblOff || '').trim() || 'วันพัก';
  const reqBtnTxt = String(p.pubReqBtnText || '').trim() || '📅 ขอจองคิว';
  document.title = (p.displayName || 'โปรไฟล์') + ' · เช็คคิว';
  const phone = (p.phone || '').replace(/[^0-9+]/g, '');
  const lineId = (p.line || '').replace(/^@/, '');
  S.canReq = p.acceptRequests !== 'no';
  const extraLinks = String(p.pubLinks || '').split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const parts = l.split('|').map(x => x.trim());
    const url = parts.length >= 2 ? parts[1] : (parts[0] || '');
    const lbl = parts.length >= 2 && parts[0] ? parts[0] : 'ลิงก์';
    if (!/^https:\/\/[^\s"'<>]+$/i.test(url)) return '';
    return '<a class="btn" href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(lbl) + ' ↗</a>';
  }).filter(Boolean).join('');
  const contacts = [
    phone ? '<a class="btn primary" href="tel:' + esc(phone) + '">' + ICON.phone + 'โทร</a>' : '',
    lineId ? '<a class="btn" href="https://line.me/ti/p/~' + encodeURIComponent(lineId) + '" target="_blank" rel="noopener">' + ICON.chat + 'LINE</a>' : '',
    p.email ? '<a class="btn" href="mailto:' + esc(p.email) + '">' + ICON.mail + 'อีเมล</a>' : '',
    extraLinks,
    S.canReq ? '<button type="button" class="btn" data-jump="1">' + esc(reqBtnTxt) + '</button>' : ''
  ].join('');
  const copyLine = [p.phone ? 'โทร ' + esc(p.phone) : '', p.line ? 'LINE ' + esc(p.line) : '', p.email ? esc(p.email) : ''].filter(Boolean).join(' · ');
  const services = String(p.services || '').split('\n').map(s => s.trim()).filter(Boolean);
  const noticeRaw = String(p.pubNotice || '').trim();
  const noticeLine = noticeRaw.replace(/\s*\n+\s*/g, '   •   ');
  const mqDur = Math.min(60, Math.max(5, Number(p.pubNoticeSpeed) || 18));
  const mqBadge = String(p.pubNoticeBadge || '').trim() || 'ประกาศ';
  const noticeHtml = !noticeRaw ? '' : (p.pubNoticeMarquee !== 'no'
    ? '<div class="pub-ticker" style="--mq-dur:' + mqDur + 's" role="region" aria-label="ประกาศ">' +
        '<span class="pt-badge"><span class="pt-dot" aria-hidden="true"></span>' + esc(mqBadge) + '</span>' +
        '<div class="pt-track"><div class="pt-move">' +
          '<span class="pt-seg">' + esc(noticeLine) + '</span>' +
          '<span class="pt-seg" aria-hidden="true">' + esc(noticeLine) + '</span>' +
        '</div></div></div>'
    : '<div class="pub-notice">' + esc(noticeRaw) + '</div>');
  let h = noticeHtml +
    '<section class="card profile">' +
    '<button type="button" class="iconbtn refresh pub-refresh" id="pubRefresh" data-refresh="1" aria-label="รีเฟรช" title="รีเฟรชข้อมูล">' + ICON.refresh + '</button>' +
    '<div class="photo" style="' + (p.photo ? 'background-image:url(&quot;' + p.photo + '&quot;)' : '') + '">' + (p.photo ? '' : esc((p.displayName || '?').charAt(0))) + '</div>' +
    '<h1>' + esc(p.displayName) + '</h1>' + (p.headline ? '<div class="headline">' + esc(p.headline) + '</div>' : '') +
    (p.bio ? '<p class="bio">' + esc(p.bio) + '</p>' : '') +
    (contacts ? '<div class="contacts">' + contacts + '</div>' : '') +
    (copyLine ? '<div class="copy">' + copyLine + '</div>' : '') + '</section>';
  if (services.length) h += '<section class="card"><h2 style="font-size:1.1rem">บริการที่รับ</h2><div class="services">' + services.map(s => '<span>' + esc(s) + '</span>').join('') + '</div></section>';
  if (p.showCalendar !== 'no') {
    h += '<section class="card"><h2 style="font-size:1.1rem">เช็คคิวงาน</h2><div class="hint">อัปเดตตามตารางงานจริง</div>' +
      '<div class="monthbar" style="margin-top:12px"><button class="iconbtn" id="prev" aria-label="เดือนก่อน">' + ICON.left + '</button><h2 id="mTitle"></h2><button class="iconbtn" id="next" aria-label="เดือนถัดไป">' + ICON.right + '</button></div>' +
      '<div class="cal" id="cal"></div><div class="sum" id="sum"></div>' +
      '<div class="legend"><span><i style="background:var(--mint-soft);border:1px solid var(--mint)"></i>' + esc(LBL.free) + '</span><span><i style="background:var(--amber-soft);border:1px solid var(--amber)"></i>' + esc(LBL.loose) + '</span>' +
      '<span><i style="background:var(--rose-soft);border:1px solid var(--rose)"></i>' + esc(LBL.lock) + '</span><span><i style="background:var(--rest-soft);border:1px solid var(--rest)"></i>' + esc(LBL.off) + '</span></div></section>';
  }
  if (S.canReq) h += '<button type="button" class="btn primary block" id="reqOpen" data-jump="1" style="min-height:54px;font-size:1.05rem">' + esc(reqBtnTxt) + '</button>' + requestForm(p);
  h += '<div class="foot">' + (APP_URL ? '<a href="' + esc(APP_URL) + '?page=admin">สำหรับเจ้าของ</a>' : '') + '</div>';
  root.innerHTML = h;

  const fallbackToday = (() => { const n = new Date(); return n.getFullYear() + '-' + pad(n.getMonth() + 1) + '-' + pad(n.getDate()); })();
  S.days = d.days || {}; S.today = /^\d{4}-\d{2}-\d{2}$/.test(String(d.today || '')) ? d.today : fallbackToday; S.pick = '';
  const [ty, tm] = S.today.split('-').map(Number);
  S.minKey = ty * 12 + tm - 1; S.maxKey = S.minKey + 12;
  const curKey = S.y * 12 + S.m;
  if (!S.loaded || curKey < S.minKey || curKey > S.maxKey) { S.y = ty; S.m = tm - 1; }
  S.loaded = true;
  if (p.showCalendar !== 'no') {
    $('prev').onclick = () => { if (--S.m < 0) { S.m = 11; S.y--; } renderCal(); };
    $('next').onclick = () => { if (++S.m > 11) { S.m = 0; S.y++; } renderCal(); };
    renderCal();
  }
  if (S.canReq) wireForm();
}

function checkDates() {
  const s = $('r_date').value, e = $('r_end').value || s;
  if (!s) { $('r_state').innerHTML = ''; return; }
  if (s < S.today) { $('r_state').innerHTML = '<div class="msg bad">กรุณาเลือกวันที่ตั้งแต่วันนี้เป็นต้นไป</div>'; return; }
  if (e < s) { $('r_state').innerHTML = '<div class="msg bad">“ถึงวันที่” ต้องไม่ก่อนวันเริ่ม</div>'; return; }
  const bad = [], looses = [];
  for (let d = s, n = 0; d <= e && n < 62; n++) {
    const st = stOf(d);
    if (st === 'lock' || st === 'off') bad.push(thFull(d) + ' ' + LBL[st]);
    else if (st === 'loose') looses.push(thFull(d));
    const p = d.split('-').map(Number); d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + 1)).toISOString().slice(0, 10);
  }
  $('r_state').innerHTML = bad.length ? '<div class="msg warn">' + esc(bad.slice(0, 3).join(', ')) + (bad.length > 3 ? ' …' : '') + ' — ส่งคำขอได้ แต่อาจไม่ว่าง</div>'
    : looses.length ? '<div class="msg warn">' + (looses.length === 1 && s === e ? 'วันนี้มีคิวหลวมอยู่' : 'ช่วงที่เลือกมีคิวหลวม (' + esc(looses.slice(0, 3).join(', ')) + (looses.length > 3 ? ' …' : '') + ')') + ' ส่งคำขอเป็นคิวสำรองได้</div>'
    : '<div class="msg ok">วันที่เลือกว่าง ✓</div>';
  S.pick = s; if ($('cal')) renderCal();
}

function wireForm() {
  $('r_date').min = S.today; $('r_end').min = S.today;
  ['r_date', 'r_end'].forEach(id => { $(id).addEventListener('input', checkDates); $(id).addEventListener('change', checkDates); });
  $('reqForm').addEventListener('submit', async e => {
    e.preventDefault();
    const v = id => $(id).value.trim();
    const bad = (m, id) => { $('r_msg').innerHTML = '<div class="msg bad">' + m + '</div>'; if (id) $(id).focus(); };
    if (!v('r_date')) return bad('กรุณาเลือกวันที่ต้องการ', 'r_date');
    if (v('r_end') && v('r_end') < v('r_date')) return bad('“ถึงวันที่” ต้องไม่ก่อนวันเริ่ม', 'r_end');
    if (!v('r_name')) return bad('กรุณาใส่ชื่อผู้ติดต่อ', 'r_name');
    if (!v('r_phone') && !v('r_line')) return bad('กรุณาใส่เบอร์โทรหรือ LINE อย่างน้อย 1 ช่อง', 'r_phone');
    const loc = v('r_loc'), isUrl = /^https:\/\//i.test(loc);
    $('r_send').disabled = true; $('r_send').textContent = 'กำลังส่ง…'; $('r_msg').innerHTML = '';
    const reqDate = v('r_date'), reqEnd = v('r_end'), reqQ = (document.querySelector('input[name="r_queue"]:checked') || {}).value || 'lock';
    try {
      await run('submitRequest', { date: reqDate, endDate: reqEnd, time: v('r_time'), house: v('r_house'), name: v('r_name'), phone: v('r_phone'), line: v('r_line'), location: isUrl ? '' : loc, mapUrl: isUrl ? loc : '', detail: v('r_detail'), website: v('r_web'), queue: reqQ });
      $('reqCard').innerHTML = '<div class="done"><div class="ic">✓</div><h2 style="font-size:1.2rem">ส่งคำขอแล้ว</h2><p class="hint">ขอคิววันที่ ' + esc(thFull(reqDate)) + (reqEnd ? ' – ' + esc(thFull(reqEnd)) : '') + '<br>แบบ: ' + (reqQ === 'loose' ? 'คิวหลวม' : '🔒 ล็อกคิว') + '<br>จะติดต่อกลับเพื่อยืนยันคิวโดยเร็ว</p><button type="button" class="btn" data-refresh="1" style="margin-top:8px">รีเฟรชหน้านี้</button></div>';
    } catch (err) { $('r_send').disabled = false; $('r_send').textContent = 'ส่งคำขอจองคิว'; bad(esc(err)); }
  });
}

async function loadPublic(fromBtn) {
  if (S.refreshing) return;
  S.refreshing = true;
  if (fromBtn) { fromBtn.classList.add('spin'); fromBtn.disabled = true; }
  try {
    const d = await run('getPublicData');
    render(d);
    if (fromBtn) toast('อัปเดตข้อมูลแล้ว');
  } catch (err) {
    if (fromBtn) toast('อัปเดตไม่สำเร็จ ลองใหม่อีกครั้ง');
    else $('root').innerHTML = '<div class="card" style="text-align:center"><p>โหลดข้อมูลไม่สำเร็จ กรุณาลองอีกครั้ง</p><button type="button" class="btn primary" data-refresh="1">🔄 ลองโหลดใหม่</button></div>';
  } finally {
    S.refreshing = false;
    if (fromBtn && fromBtn.isConnected) { fromBtn.classList.remove('spin'); fromBtn.disabled = false; }
  }
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-pick],[data-jump],[data-close],[data-refresh]'); if (!t) return;
  e.preventDefault();
  if (t.dataset.refresh) { loadPublic(t); return; }
  if (t.dataset.close) {
    $('reqCard').hidden = true; if ($('reqOpen')) $('reqOpen').hidden = false; S.pick = ''; if ($('cal')) renderCal();
    if ($('reqOpen')) $('reqOpen').scrollIntoView({ block: 'center' }); return;
  }
  if (t.dataset.pick && $('r_date')) { $('r_date').value = t.dataset.pick; $('r_end').value = ''; checkDates(); }
  const card = $('reqCard');
  if (card) {
    card.hidden = false;
    if ($('reqOpen')) $('reqOpen').hidden = true;
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    setTimeout(() => { const fe = $(t.dataset.pick ? 'r_name' : 'r_date'); if (fe) fe.focus({ preventScroll: true }); }, 400);
  }
});

initFloatingClock_();
loadPublic(null);
</script>
</body>
</html>
